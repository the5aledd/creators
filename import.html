<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Creator Hub import</title>
<style>
:root{--bg:#F3EEE3;--surface:#FBF8F2;--line:#DCD3C2;--fg:#0C0D0C;--muted:#5E5A52;--ember:#FF301B;--good:#1E7A4A;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px}
main{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:999px;border:0;background:var(--ember);color:#fff;cursor:pointer;justify-self:start}
button:disabled{opacity:.5;cursor:wait}
#log{font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);min-height:20px}
.ok{color:var(--good)} .bad{color:var(--bad)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<main>
  <h1>Creator Hub: one-time import</h1>
  <p>Loads the creators, deals, rules and activity log exported from Claude into your Firebase database. Run it once, then delete this file from the site.</p>
  <div class="card">
    <label>Admin password<input id="pw" type="password" autocomplete="current-password"></label>
    <label>Data file (creator-hub-data.json)<input id="file" type="file" accept=".json,application/json"></label>
    <button id="go" type="button">Import</button>
    <div id="log"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const log = (t, cls) => { const d=document.createElement("div"); d.textContent=t; if(cls) d.className=cls; $("#log").appendChild(d); };
const cid = h => /^__.*__$/.test(h) ? "~"+h : h;
$("#go").onclick = async () => {
  $("#log").innerHTML = "";
  const f = $("#file").files[0];
  if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey) return log("firebase-config.js is still empty. Paste your project settings first.", "bad");
  if(!$("#pw").value) return log("Type the admin password.", "bad");
  if(!f) return log("Choose creator-hub-data.json.", "bad");
  $("#go").disabled = true;
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    await firebase.auth().signInWithEmailAndPassword("admin@creators.percent-labs.com", $("#pw").value);
    log("Signed in as admin.");
    const data = JSON.parse(await f.text());
    const db = firebase.firestore(); db.settings({ignoreUndefinedProperties:true, merge:true});
    const writes = [];
    for(const [h, c] of Object.entries(data.creators||{})) writes.push([db.collection("creators").doc(cid(h)), {...c, handle:h}]);
    for(const [id, k] of Object.entries(data.campaigns||{})) writes.push([db.collection("campaigns").doc(id), k]);
    for(const [id, x] of Object.entries(data.settings||{})) writes.push([db.collection("settings").doc(id), x]);
    for(const e of (data.logs||[])) writes.push([db.collection("logs").doc(), e]);
    log(`Writing ${writes.length} records…`);
    for(let i=0; i<writes.length; i+=400){
      const b = db.batch(); writes.slice(i, i+400).forEach(([ref, v]) => b.set(ref, v)); await b.commit();
      log(`  ${Math.min(i+400, writes.length)} / ${writes.length}`);
    }
    await db.collection("logs").add({at:new Date().toISOString(), username:"admin", user:"Admin", role:"admin", act:"settings", summary:`Imported ${Object.keys(data.creators||{}).length} creators and ${Object.keys(data.campaigns||{}).length} deals from Claude`, ref:null});
    log(`Done: ${Object.keys(data.creators||{}).length} creators, ${Object.keys(data.campaigns||{}).length} deals, ${(data.logs||[]).length} log entries.`, "ok");
    log("Now delete import.html from the site and open the Hub.", "ok");
    await firebase.auth().signOut();
  }catch(e){
    log(e && e.code==="auth/invalid-credential" || e.code==="auth/wrong-password" ? "Wrong admin password." :
        e && e.code==="permission-denied" ? "The database refused the import. Publish firestore.rules first (step 4 in the guide)." :
        "Import failed: " + (e && (e.message||e.code) || e), "bad");
  }finally{ $("#go").disabled = false; }
};
</script>
</body>
</html>
