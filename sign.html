<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Percent Labs Agreement</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
<meta name="theme-color" content="#0C0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zain:wght@400;700;800&display=swap">
<style>
:root{--bg:#F3EEE3;--surface:#FBF8F2;--line:#DCD3C2;--fg:#0C0D0C;--muted:#5E5A52;--ember:#FF301B;--deep:#7A0D08;--good:#1E7A4A;--good-bg:#DCEFE3;--bad:#A5281E;--bad-bg:#F6DAD5;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 'Space Grotesk',system-ui,sans-serif;padding:0 max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.ar{font-family:'Zain',sans-serif;direction:rtl;unicode-bidi:isolate}
.top{max-width:840px;margin:0 auto;padding:18px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:30px}
.top .no{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
main{max-width:840px;margin:0 auto;display:grid;gap:18px}
.banner{border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.banner b{font-size:16px}
.banner.ok{background:var(--good-bg);color:var(--good)} .banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.info{background:var(--surface);border:1px solid var(--line)}
.banner .ar{font-size:17px}
.paper{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);background:#fff}
.paper-in{transform-origin:top left}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.panel h2{margin:0;font-size:20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.panel h2 .ar{font-size:22px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600}
label.f .ar{font-weight:700;font-size:14px}
.lab{display:flex;justify-content:space-between;gap:10px}
input[type=text]{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.pad{position:relative;height:180px;border:1.5px dashed var(--ember);border-radius:12px;background:#fff}
.pad canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:crosshair}
.pad .hint{position:absolute;inset:auto 12px 10px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);pointer-events:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nmro{display:grid;gap:5px;font-size:13px;font-weight:600}
.nmv{font-size:18px;font-weight:700;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#F6F2EA}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:600;color:var(--fg)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;font-size:16px;padding:13px 24px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.muted{color:var(--muted);font-size:12.5px}
.err{color:var(--bad);font-weight:600;font-size:13.5px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .top,.banner,.panel,.noprint{display:none!important}
  main{max-width:none;display:block}
  .paper{box-shadow:none;border-radius:0;height:auto!important;width:auto}
  .paper-in{transform:none!important}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="agreement.js"></script>
</head>
<body>
<div class="top"><img src="agreement-logo.png" alt="percentlabs"><span class="no" id="no"></span></div>
<main id="app"><div class="banner info"><b>Loading the agreement…</b><span class="ar">جارٍ تحميل الاتفاقية…</span></div></main>
<script>
(function(){
  const A = window.PLAgreement, $ = s => document.querySelector(s), app = $("#app");
  const params = new URLSearchParams(location.search), id = params.get("a") || "", viewOnly = params.get("view")==="1";
  const banner = (cls, en, ar) => `<div class="banner ${cls}"><b>${A.esc(en)}</b>${ar?`<span class="ar">${A.esc(ar)}</span>`:""}</div>`;
  if(!/^[A-Za-z0-9]{16,40}$/.test(id)){ app.innerHTML = banner("bad","This link isn't complete. Ask Percent Labs to send it again.","الرابط غير مكتمل. اطلب من برسنت لابس إرساله مجدداً."); return; }
  let db;
  try{ firebase.initializeApp(window.FIREBASE_CONFIG); db = firebase.firestore(); }catch(e){ app.innerHTML = banner("bad","Couldn't connect. Check your internet and reload.","تعذّر الاتصال. تحقق من الإنترنت وأعد تحميل الصفحة."); return; }
  const fit = () => document.querySelectorAll(".paper").forEach(p=>{ const inner=p.querySelector(".paper-in"); const s=Math.min(1, p.clientWidth/794); inner.style.transform=`scale(${s})`; p.style.height=(1123*s)+"px"; });
  window.addEventListener("resize", fit);
  function paper(a){ return `<div class="paper"><div class="paper-in">${A.render(a)}</div></div>`; }
  function show(a){
    $("#no").textContent = a.no ? "Agreement No. "+a.no : "";
    if(a.status==="void"){ app.innerHTML = banner("bad","This agreement was cancelled by Percent Labs.","ألغت برسنت لابس هذه الاتفاقية.") + paper(a); fit(); return; }
    if(a.status==="signed"){
      const when = a.signedAt && a.signedAt.toDate ? A.longDate(a.signedAt.toDate().toISOString()) : "";
      app.innerHTML = (viewOnly ? `<div class="row noprint"><span class="muted">Signed${when?" on "+A.esc(when):""}.</span><button class="btn" id="pr" type="button">Print or save as PDF</button></div>`
        : banner("ok", `Signed${when?" on "+when:""}. Thank you!`, "تم التوقيع. شكراً لك!")) + paper(a);
      fit(); $("#pr")?.addEventListener("click",()=>window.print()); return;
    }
    if(viewOnly){ app.innerHTML = `<div class="row noprint"><span class="muted">${a.plSig?"Waiting for the creator's signature.":"Not sent to the creator yet."}</span><button class="btn" id="pr" type="button">Print or save as PDF</button></div>` + paper(a); fit(); $("#pr").onclick=()=>window.print(); return; }
    const exp = a.expiresAt ? (a.expiresAt.toMillis ? a.expiresAt.toMillis() : a.expiresAt.seconds*1000) : 0;
    if(a.plSig && exp && Date.now() > exp){ app.innerHTML = banner("bad","This signing link has expired. Ask Percent Labs to send you a new one.","انتهت صلاحية رابط التوقيع. اطلب من برسنت لابس إرسال رابط جديد."); return; }
    if(a.plSig && !(a.creatorName||"").trim()){ app.innerHTML = banner("info","This agreement isn't ready to sign yet. Percent Labs will send you the link.","هذه الاتفاقية ليست جاهزة للتوقيع بعد. سترسل لك برسنت لابس الرابط."); return; }
    if(!a.plSig){ app.innerHTML = banner("info","This agreement isn't ready to sign yet. Percent Labs will send you the link.","هذه الاتفاقية ليست جاهزة للتوقيع بعد. سترسل لك برسنت لابس الرابط.") ; return; }
    app.innerHTML = banner("info", `Please read the agreement for ${a.brand} and sign at the bottom.`, `يرجى قراءة الاتفاقية مع ${a.brand} والتوقيع في الأسفل.`) + paper(a) + `
      <section class="panel" aria-labelledby="sgT">
        <h2 id="sgT"><span>Sign the agreement</span><span class="ar">توقيع الاتفاقية</span></h2>
        <div class="f nmro"><span class="lab"><span>Signing as</span><span class="ar">التوقيع باسم</span></span><div class="nmv" id="nmv">${A.esc(a.creatorName)}</div><span class="muted">Not your name or spelled wrong? Don't sign. Tell Percent Labs and they'll fix it and send a new link. · إذا كان الاسم خاطئاً لا توقّع، وأخبر برسنت لابس لتصحيحه.</span></div>
        <div class="f" style="display:grid;gap:5px;font-size:13px;font-weight:600"><span class="lab"><span>Your signature (draw with your finger)</span><span class="ar">توقيعك (ارسمه بإصبعك)</span></span>
          <div class="pad"><canvas id="cv" aria-label="Signature pad"></canvas><div class="hint"><span>Sign here</span><span class="ar">وقّع هنا</span></div></div>
          <div class="row"><span class="muted" id="padState">Nothing drawn yet</span><button type="button" class="btn" id="clr">Clear · مسح</button></div></div>
        <label class="check"><input type="checkbox" id="ok"><span>I have read this agreement and agree to its terms. My electronic signature is binding (term 06).<span class="ar" style="display:block;text-align:right">قرأت هذه الاتفاقية وأوافق على شروطها، وتوقيعي الإلكتروني مُلزِم (البند 06).</span></span></label>
        <div class="err" id="er" role="alert"></div>
        <button type="button" class="btn primary" id="sg">Sign · توقيع</button>
        <span class="muted">The date and time are recorded automatically when you sign.${exp?` This link works until ${A.esc(new Date(exp).toLocaleString("en-GB",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}))}.`:""}</span>
      </section>`;
    fit();
    const pad = A.signaturePad($("#cv"));
    $("#cv").addEventListener("sigchange", ()=>{ $("#padState").textContent = pad.isEmpty() ? "Nothing drawn yet" : "Signature drawn ✓"; });
    $("#clr").onclick = () => pad.clear();
    $("#sg").onclick = async () => {
      const er=$("#er"), name=a.creatorName;
      if(pad.isEmpty()){ er.textContent="Draw your signature in the box. · ارسم توقيعك في المربع."; return; }
      if(!$("#ok").checked){ er.textContent="Tick the box to confirm you agree. · ضع علامة للتأكيد على موافقتك."; return; }
      const sig = pad.toPNG(); if(!sig){ er.textContent="Draw your signature in the box. · ارسم توقيعك في المربع."; return; }
      er.textContent=""; const b=$("#sg"); b.disabled=true; b.textContent="Signing… · جارٍ التوقيع…";
      try{
        await db.collection("agreements").doc(id).update({status:"signed", creatorSig:sig, creatorSignedName:name, signedAt:firebase.firestore.FieldValue.serverTimestamp(), signedVia:"link", signedUA:navigator.userAgent.slice(0,200)});
        const d = await db.collection("agreements").doc(id).get(); show(d.data()); window.scrollTo({top:0, behavior:"smooth"});
      }catch(e){ b.disabled=false; b.textContent="Sign · توقيع"; er.textContent = "Couldn't sign. Check your internet and try again. If it keeps failing, ask Percent Labs for a new link. · تعذّر التوقيع. حاول مجدداً."; }
    };
  }
  db.collection("agreements").doc(id).get().then(d=>{
    if(!d.exists){ app.innerHTML = banner("bad","This agreement link isn't valid. Ask Percent Labs to send it again.","رابط الاتفاقية غير صالح. اطلب من برسنت لابس إرساله مجدداً."); return; }
    show(d.data());
  }).catch(()=>{ app.innerHTML = banner("bad","Couldn't load the agreement. Check your internet and reload.","تعذّر تحميل الاتفاقية. تحقق من الإنترنت وأعد تحميل الصفحة."); });
})();
</script>
</body>
</html>
