}
function gateSetup(){
  const g=$("#gate");
  document.documentElement.style.overflow="hidden";
  const un=$("#gUser"), pw=$("#gPw"), msg=$("#gMsg"), pct=$("#gPct"), fill=$("#gFill");
  const bad = t => { g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); msg.classList.add("bad"); msg.textContent=t; };
  if(!initFirebase()){ msg.textContent="Firebase isn't set up yet."; return; }
  let justSigned = false;
  FB.auth.onAuthStateChanged(user=>{
    const u = user && user.email && user.email.endsWith("@"+EMAIL_DOMAIN) ? user.email.split("@")[0].toLowerCase() : null;
    if(user && !USERS[u]){ FB.auth.signOut(); bad("This account isn't on the Creator Hub team."); return; }
    if(!user){ S.me=null; unsubs.forEach(x=>x()); unsubs=[]; db=null; applyRole(); g.hidden=false; document.documentElement.style.overflow="hidden"; setTimeout(()=>un.focus(),50); return; }
    S.me = {username:u, ...USERS[u]}; applyRole(); boot(); render();
    if(justSigned){ justSigned=false; logAct("login", `${S.me.name} signed in`); return; }               // the animation below hides the gate
    g.hidden=true; document.documentElement.style.overflow="";
  });
  [un,pw].forEach(i=>i.addEventListener("input",()=>{ msg.classList.remove("bad"); msg.textContent="Percent Labs team access"; }));
  $("#gForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const u = un.value.trim().toLowerCase().replace(/^@/,"");
    if(!u){ bad("Type your username first."); un.focus(); return; }
    if(!pw.value){ bad("Type your password."); pw.focus(); return; }
    if(!USERS[u]){ bad("Username or password doesn't match. Passwords are case-sensitive."); pw.select(); return; }
    justSigned = true;
    try{ await FB.auth.signInWithEmailAndPassword(`${u}@${EMAIL_DOMAIN}`, pw.value); }
    catch(err){ justSigned=false;
      if(err && err.code==="auth/too-many-requests") bad("Too many tries. Wait a few minutes and try again.");
      else if(err && err.code==="auth/network-request-failed") bad("No connection. Check your internet and try again.");
      else bad("Username or password doesn't match. Passwords are case-sensitive.");
      pw.select(); return; }
    msg.textContent=`Welcome, ${S.me?.name||USERS[u].name}.`;
    fill.style.strokeDashoffset="0";
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ pct.textContent="100%"; } else { const t0=performance.now(); const tick=t=>{ const p=Math.min(1,(t-t0)/900); pct.textContent=Math.round(p*100)+"%"; if(p<1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
    g.classList.add("open");
    setTimeout(()=>{ g.hidden=true; g.classList.remove("open"); document.documentElement.style.overflow=""; pw.value=""; un.value=""; pct.textContent="0%"; fill.style.strokeDashoffset=""; }, reduce?400:1700);
  });
}
$("#userBtn").addEventListener("click", e=>{ e.stopPropagation(); const m=$("#userMenu"); m.hidden=!m.hidden; $("#userBtn").setAttribute("aria-expanded", String(!m.hidden)); });
document.addEventListener("click", e=>{ const m=$("#userMenu"); if(m && !m.hidden && !e.target.closest(".usermenu")){ m.hidden=true; $("#userBtn").setAttribute("aria-expanded","false"); } });
$("#btnLock").addEventListener("click", async ()=>{ $("#userMenu").hidden=true;
  if(S.me) await logAct("logout", `${S.me.name} signed out`);
  closeDrawer(); await FB?.auth.signOut();
  const g=$("#gate"); g.hidden=false; document.documentElement.style.overflow="hidden";
  $("#gMsg").textContent="Signed out. Percent Labs team access"; setTimeout(()=>$("#gUser").focus(),50);
});

/* ---------- Admin: activity & team ---------- */
const ACTS = {
  book:{l:"Booked deal", i:"＋", tone:"good"}, results:{l:"Logged results", i:"▤", tone:""}, dates:{l:"Moved post dates", i:"↻", tone:""},
  terms:{l:"Changed deal terms", i:"✎", tone:"warn"}, cancel:{l:"Cancelled deal", i:"⨯", tone:"bad"}, restore:{l:"Restored deal", i:"↺", tone:""},
  delete_deal:{l:"Deleted deal", i:"🗑", tone:"bad"}, onboard:{l:"Onboarded creator", i:"＋", tone:"good"}, edit_creator:{l:"Edited creator", i:"✎", tone:""},
  delete_creator:{l:"Deleted creator", i:"🗑", tone:"bad"}, status:{l:"Outreach update", i:"✉", tone:""}, followers:{l:"Follower update", i:"↑", tone:""},
  settings:{l:"Changed rules or budget", i:"⚙", tone:"warn"}, dnb:{l:"Flagged do not book", i:"⛔", tone:"bad"}, undnb:{l:"Removed do-not-book flag", i:"↺", tone:""}, login:{l:"Signed in", i:"→", tone:"muted"}, logout:{l:"Signed out", i:"←", tone:"muted"},
};
S.ad = S.ad || {period:7, user:"", act:"", important:false};
async function loadLogs(){
  if(!db || !isAdmin()) return {ok:false, events:[]};
  try{ const q = await db.collection("logs").orderBy("at","desc").limit(2000).get(); return {ok:true, events:q.docs.map(d=>({id:d.id, ...d.data()}))}; }
  catch(e){ return {ok:false, events:[]}; }
}
const relTime = ts => { const m=Math.round((Date.now()-new Date(ts))/6e4); return m<1?"just now": m<60?`${m} min ago`: m<1440?`${Math.round(m/60)} h ago`: `${Math.round(m/1440)} d ago`; };
const isImportant = e => ["terms","cancel","delete_deal","delete_creator","settings","dnb"].includes(e.act);
async function renderAdmin(){
  if(!isAdmin()){ S.tab="find"; return render(); }
  $("#main").innerHTML = `<div class="notice">Loading activity…</div>`;
  const {ok, events} = await loadLogs();
  if(S.tab!=="admin") return;
  const A = S.ad, since = A.period ? Date.now()-A.period*864e5 : 0;
  const inPeriod = events.filter(e=>new Date(e.at)>=since);
  const work = inPeriod.filter(e=>e.act!=="login" && e.act!=="logout");
  const count = a => work.filter(e=>e.act===a).length;
  const shown = inPeriod.filter(e=>(!A.user||e.username===A.user) && (!A.act||e.act===A.act) && (!A.important||isImportant(e)));
  const lastSeen = u => events.find(e=>e.username===u)?.at;
  const team = Object.entries(USERS).map(([u,x])=>({u, ...x, n: work.filter(e=>e.username===u).length, last:lastSeen(u),
    top: Object.entries(work.filter(e=>e.username===u).reduce((m,e)=>(m[e.act]=(m[e.act]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,3)}));
  const maxN = Math.max(1,...team.map(t=>t.n));
  const byDay = {}; shown.forEach(e=>{ const d=iso(new Date(e.at)); (byDay[d] ||= []).push(e); });
  const dayLabel = d => d===iso(TODAY) ? "Today" : d===iso(addDays(iso(TODAY),-1)) ? "Yesterday" : fmtD(d);
  const flagged = work.filter(isImportant).slice(0,5);
  $("#main").innerHTML = `
  <div class="adm">
    <div class="adm-head"><div><h2>Activity &amp; team</h2><p class="lede">Only you see this tab. Every save in the Hub is recorded here with who did it and when.</p></div>
      <div class="league" role="group" aria-label="Period">${[[7,"7 days"],[30,"30 days"],[0,"All time"]].map(([v,l])=>`<button type="button" data-per="${v}" aria-pressed="${A.period===v}">${l}</button>`).join("")}</div></div>
    ${ok ? "" : `<div class="warnbox">Couldn't load the activity log. Check your connection, or that the security rules are published.</div>`}
    <div class="kpis">
      <div class="kpi"><div class="v">${work.length}</div><div class="k">Changes saved</div></div>
      <div class="kpi"><div class="v">${count("book")}</div><div class="k">Deals booked</div></div>
      <div class="kpi"><div class="v">${count("results")}</div><div class="k">Results logged</div></div>
      <div class="kpi"><div class="v">${count("onboard")}</div><div class="k">Creators onboarded</div></div>
      <div class="kpi"><div class="v" style="color:${work.filter(isImportant).length?"var(--bad)":"inherit"}">${work.filter(isImportant).length}</div><div class="k">Need a look (terms, cancels, deletes)</div></div>
    </div>
    <div class="adm-grid">
      <section>
        <h3 class="pb-h">Team &amp; access</h3>
        <div class="team">${team.map(t=>`<div class="tm">
          <div class="tm-h"><i class="av" style="background:${USER_COLORS[t.u]}">${esc(t.name[0])}</i><div><b>${esc(t.name)}</b><small>@${esc(t.u)} · ${esc(ROLE_LABEL[t.role])}</small></div><span class="tm-last">${t.last?esc(relTime(t.last)):"never signed in"}</span></div>
          <div class="tm-bar"><span style="width:${t.n/maxN*100}%;background:${USER_COLORS[t.u]}"></span></div>
          <div class="tm-meta"><b class="num">${t.n}</b> change${t.n!==1?"s":""}${t.top.length?" · "+t.top.map(([a,n])=>`${n} ${esc(ACTS[a]?.l.toLowerCase()||a)}`).join(", "):""}</div>
          <div class="tm-acc">${t.role==="admin"?`<span class="ok">Everything</span><span class="ok">Activity &amp; team</span>`:`<span class="ok">Creators, deals, results</span><span class="ok">Outreach &amp; follow-ups</span><span class="no">Deleting</span><span class="no">Rules &amp; budgets</span><span class="no">Activity &amp; team</span>`}</div>
        </div>`).join("")}</div>
        <p class="hint">To add someone or change a password, use Authentication in the Firebase console. Passwords are case-sensitive.</p>
        ${rulesHTML()}
        ${flagged.length?`<h3 class="pb-h" style="margin-top:22px">Need a look</h3><div class="feed">${flagged.map(evHTML).join("")}</div>`:""}
      </section>
      <section style="min-width:0">
        <h3 class="pb-h">Activity</h3>
        <div class="toolbar">
          <label class="tb"><span>Person</span><select id="adU" class="in"><option value="">Everyone</option>${Object.entries(USERS).map(([u,x])=>`<option value="${u}" ${A.user===u?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
          <label class="tb"><span>Action</span><select id="adA" class="in"><option value="">All actions</option>${Object.entries(ACTS).map(([k,x])=>`<option value="${k}" ${A.act===k?"selected":""}>${esc(x.l)}</option>`).join("")}</select></label>
          <label class="check" style="align-self:flex-end;padding-bottom:8px"><input type="checkbox" id="adI" ${A.important?"checked":""}> Only what needs a look</label>
        </div>
        <div class="feed">${Object.keys(byDay).length ? Object.entries(byDay).map(([d,evs])=>`<div class="fd-day">${esc(dayLabel(d))}<span>${evs.length}</span></div>${evs.map(evHTML).join("")}`).join("") : `<div class="notice">${ok?"No activity in this period yet.":"Activity shows here on the owner's account."}</div>`}</div>
      </section>
    </div>
  </div>`;
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ A.period=+b.dataset.per; renderAdmin(); });
  wireRules();
  $("#adU").onchange=e=>{ A.user=e.target.value; renderAdmin(); };
  $("#adA").onchange=e=>{ A.act=e.target.value; renderAdmin(); };
  $("#adI").onchange=e=>{ A.important=e.target.checked; renderAdmin(); };
  document.querySelectorAll("[data-ev-deal]").forEach(b=>b.onclick=()=>{ if(S.campaigns[b.dataset.evDeal]) openCampaign(b.dataset.evDeal); else toast("That deal no longer exists."); });
  document.querySelectorAll("[data-ev-creator]").forEach(b=>b.onclick=()=>{ if(S.creators[b.dataset.evCreator]) openCreator(b.dataset.evCreator); else toast("That creator is no longer in the roster."); });
}
function evHTML(e){
  const a = ACTS[e.act] || {l:e.act, i:"•", tone:""};
  const t = new Date(e.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const link = e.ref?.deal ? `<button type="button" class="linkbtn" data-ev-deal="${esc(e.ref.deal)}">Open deal</button>` : e.ref?.creator ? `<button type="button" class="linkbtn" data-ev-creator="${esc(e.ref.creator)}">Open creator</button>` : "";
  return `<div class="ev ${a.tone}"><span class="ev-i" aria-hidden="true">${a.i}</span><div class="ev-b"><div><i class="av sm" style="background:${USER_COLORS[e.username]||"var(--muted)"}">${esc((e.user||"?")[0])}</i><b>${esc(e.user||e.username)}</b> <span class="ev-l">${esc(a.l)}</span></div><p>${esc(e.summary||"")}</p></div><div class="ev-r"><span class="num">${esc(t)}</span>${link}</div></div>`;
}

gateSetup();


})();
</script>
