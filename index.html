*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}

.mark h1{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0}
.mark small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px;width:100%}

.gmt-fill{fill:none;stroke:#F3EEE3;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352;transition:stroke-dashoffset .9s cubic-bezier(.6,0,.2,1)}
.g-orbit{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(243,238,227,.16);animation:gspin 38s linear infinite}
.g-ring{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#FF301B,#F1902A,#D6408F,#FF301B);animation:gspin 38s linear infinite reverse}

<script>
(() => {
const BRANDS = [
  {key:"nashheat", name:"Nash Heat", c:"var(--nash)"},
  {key:"bunzo", name:"Bunzo", c:"var(--bunzo)"},
  {key:"broasty", name:"Broasty", c:"var(--broasty)"},
  {key:"rockyroad", name:"Rocky Road", c:"var(--rocky)"},
  {key:"daboos", name:"Daboos", c:"var(--daboos)"},
  {key:"wingville", name:"Wingville", c:"var(--wing)"},
];
const BNAME = Object.fromEntries(BRANDS.map(b=>[b.name,b.key]));
const STATUSES = [
  {key:"worked", label:"Worked with"},
  {key:"interested", label:"Interested"},
  {key:"want", label:"Want to book"},
  {key:"contacted", label:"Contacted, waiting"},
  {key:"none", label:"Not contacted"},
  {key:"declined", label:"Declined"},
];
const SLABEL = Object.fromEntries(STATUSES.map(s=>[s.key,s.label]));
const CATS = ["Food","Comedy","Lifestyle","General creator","Beauty & fashion","Fitness & sport","Professional","Media & screen","Arts & photo"];
const TIERS = [{k:"Nano",max:1e4},{k:"Micro",max:5e4},{k:"Mid",max:2e5},{k:"Macro",max:1e6},{k:"Mega",max:Infinity}];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const S = {
  creators:{}, campaigns:{}, settings:{cooldownWeeks:6, crossDays:14},
  tab:"today", loaded:{c:false,k:false},
  f:{q:"", brand:"", show:"all", cats:new Set(), tiers:new Set(), maxRate:"", hideCool:true, platform:""},
  sort:"best", shown:60, fShow:"priority", readOnly:false,
};
try{ const t = localStorage.getItem("ch_tab"); if(t) S.tab=t; }catch(e){}

let db = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtN = n => n==null||isNaN(n) ? "—" : n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M" : n>=1e3 ? (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"K" : String(Math.round(n));
const fmt$ = (n,d) => n==null||!isFinite(n) ? "—" : "$"+(d==null ? (n>=100?Math.round(n).toLocaleString():n.toFixed(2)) : n.toFixed(d));
const pct = n => n==null||!isFinite(n) ? "—" : (n*100).toFixed(n<0.01?2:1)+"%";
const tierOf = f => f==null ? "" : TIERS.find(t=>f<t.max).k;
const parseFollowers = s => { if(s==null) return null; s=String(s).trim().replace(/[,\s]/g,""); if(!s) return null; return /^\d{1,10}$/.test(s) ? Number(s) : NaN; };
const FOLLOW_MSG = "Followers must be the full number, digits only, e.g. 45200 (no k, M or decimals).";
const parseNum = s => { if(s==null) return null; s=String(s).trim().toLowerCase().replace(/,/g,""); if(!s) return null; const m=s.match(/^([\d.]+)\s*([km]?)$/); if(!m) return NaN; return Math.round(parseFloat(m[1])*({k:1e3,m:1e6}[m[2]]||1)); };
const daysSince = d => d ? Math.floor((TODAY - new Date(d+"T00:00:00"))/864e5) : Infinity;
const addDays = (d,n) => { const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x; };
const fmtDate = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const profileUrl = c => `https://www.instagram.com/${encodeURIComponent(c.handle)}/`;
const scoreColor = s => s>=65 ? "var(--good)" : s>=40 ? "var(--warn)" : "var(--bad)";
const verdict = s => s>=65 ? ["rebook","Rebook"] : s>=40 ? ["reneg","Renegotiate"] : ["drop","Drop"];

function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2600); }
async function write(fn, ok, log){
  if(!db){ toast("Not connected yet. Sign in first."); return false; }
  try{ await fn(); if(ok) toast(ok); if(log) logAct(log.act, log.summary, log.ref); return true; }
  catch(e){
    if(e && e.code==="permission-denied"){ toast(isAdmin()?"The database refused this change. Check the security rules.":"Only the admin can do that."); }
    else if(e && e.code==="resource-exhausted"){ toast("Today's free database limit is used up. Try again tomorrow, or ask Khaled."); }
    else { toast("Couldn't save. Check your connection and try again."); }
    return false;
  }
}

/* ---------- Deals, dates & scoring ---------- */
// Every campaign is one deal. Its posts live in k.deliverables: [{type:"Reel"|"Story", date:"YYYY-MM-DD"}].
function delivs(k){
  if(Array.isArray(k.deliverables)) return k.deliverables.filter(d=>d && /^\d{4}-\d{2}-\d{2}$/.test(d.date||"")).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return (k.dates||[]).slice().sort().map((d,i)=>({type: k.package==="Reel"||i===0 ? "Reel" : "Story", date:d}));
}
const reelDates = k => delivs(k).filter(d=>d.type==="Reel").map(d=>d.date);
const lastReel = k => reelDates(k).at(-1) || null;
const lastDate = k => delivs(k).map(d=>d.date).at(-1) || null;
const firstDate = k => delivs(k).map(d=>d.date)[0] || null;
const fmtD = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—";
const fmtDs = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "—";
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/864e5);
function dealCounts(k){ const d=delivs(k); if(!d.length) return "No posts yet"; const r=d.filter(x=>x.type==="Reel").length, s=d.length-r; return [r?`${r} reel${r>1?"s":""}`:"", s?`${s} stor${s>1?"ies":"y"}`:""].filter(Boolean).join(" · "); }
function dealRange(k){
  const d = delivs(k); if(!d.length) return "No dates yet";
  const r = d.filter(x=>x.type==="Reel").length, s = d.length - r;
  const span = d[0].date===d.at(-1).date ? fmtDs(d[0].date) : `${fmtDs(d[0].date)} – ${fmtDs(d.at(-1).date)}`;
  return `${span} · ${r} reel${r!==1?"s":""}${s?` · ${s} stor${s!==1?"ies":"y"}`:""}`;
}

const IMPORT_DATE = "2026-10-18"; // when the old sheet was imported; its numbers have no measured-on date
const REELS_DAYS = 7, CODE_DAYS = 14;
// Each reel carries its own results. Old imported deals with several reels keep one combined set.
function reelUnits(k){
  const reels = delivs(k).filter(d=>d.type==="Reel");
  const perReel = reels.some(r=>r.views!=null||r.shares!=null||r.saves!=null||r.measuredOn);
  if(!perReel && k.views!=null) return [{i:0, date:reels.at(-1)?.date||lastDate(k), views:k.views, shares:k.shares??null, saves:k.saves??null, measuredOn:k.resultsMeasuredOn||"", price:k.price, combined:true, n:reels.length}];
  return reels.map((r,i)=>({i, date:r.date, views:r.views??null, shares:r.shares??null, saves:r.saves??null, measuredOn:r.measuredOn||"", price: k.price!=null && reels.length ? k.price/reels.length : null}));
}
function unitState(k,u){
  const today=iso(TODAY), due=iso(addDays(u.date, REELS_DAYS));
  if(u.date>today) return {s:"waiting", due};
  if(u.measuredOn && u.measuredOn>=due) return {s:"done", due};
  if(!u.measuredOn && k.importedFromSheet && u.views!=null && due<=IMPORT_DATE) return {s:"done", due};
  return {s: today>=due ? "due" : "waiting", due};
}
function dueInfo(k){
  if(k.status==="Cancelled") return null;
  const lr = lastReel(k);
  if(!lr) return {state: delivs(k).length ? "noreel" : "nodates"};
  const today = iso(TODAY);
  const us = reelUnits(k).map(u=>({u, ...unitState(k,u)}));
  const r = us.some(x=>x.s==="due") ? "due" : us.some(x=>x.s==="waiting") ? "waiting" : "done";
  const pend = us.filter(x=>x.s!=="done").map(x=>x.due).sort();
  const reelsDue = pend[0] || us.map(x=>x.due).sort().at(-1);
  const codeDue = k.hasCode ? iso(addDays(lr, CODE_DAYS)) : null;
  let c = null;
  if(k.hasCode){ const m=k.codeMeasuredOn; c = m && m>=codeDue ? "done" : today>=codeDue ? "due" : "waiting"; }
  const nDue = us.filter(x=>x.s==="due").length;
  return {lr, reelsDue, codeDue, r, c, nDue, units:us, state: (r==="due"||c==="due") ? "due" : (r==="waiting"||c==="waiting") ? "waiting" : "done"};
}
function dueHTML(k){ return stageHTML(k); }

function unitMetrics(u){
  const p = u.price>0 ? u.price : null;
  const per = n => p==null || n==null ? null : n>0 ? p/n : Infinity;
  return { cpm: p && u.views>0 ? p/u.views*1000 : null, cps: u.views>0 ? per(u.shares) : null,
    spv: u.views>0 && u.shares!=null ? u.shares/u.views : null, cpsv: u.views>0 ? per(u.saves) : null };
}
// Deal-level totals, used for display in tables.
function campMetrics(k){
  const t = unitMetrics({price:k.price, views:k.views, shares:k.shares, saves:k.saves});
  const p = k.price>0 ? k.price : null;
  t.cpo = k.hasCode && k.orders!=null && p ? (k.orders>0 ? p/k.orders : Infinity) : null;
  t.roas = p && k.hasCode && k.revenue>0 ? k.revenue/p : null;
  t.ontime = k.onTime==null ? null : (k.onTime?1:0);
  return t;
}
const fmtCost = v => v===Infinity ? "none" : fmt$(v);
const METRICS = [
  {k:"cpm",  label:"Cost per 1K views", w:.25, lower:true,  fmt:fmtCost, how:"Reel's share of the price ÷ its views × 1,000", unit:true},
  {k:"cps",  label:"Cost per share",    w:.20, lower:true,  fmt:fmtCost, how:"Reel's share of the price ÷ its shares", unit:true},
  {k:"spv",  label:"Shares ÷ views",    w:.20, lower:false, fmt:pct,     how:"Reel's shares ÷ its views", unit:true},
  {k:"cpsv", label:"Cost per save",     w:.15, lower:true,  fmt:fmtCost, how:"Reel's share of the price ÷ its saves", unit:true},
  {k:"cpo",  label:"Cost per code use", w:.15, lower:true,  fmt:fmtCost, how:"Deal price ÷ orders that used the creator's code. Only for deals with a code."},
  {k:"ontime",label:"Posted on time",   w:.05, fixed:true,  fmt:v=>v?"Yes":"No, late", how:"Yes = full points for this part, late = none"},
];
const UNIT_METRICS = METRICS.filter(M=>M.unit);
const CONTENT_W = UNIT_METRICS.reduce((a,M)=>a+M.w,0); // 0.80
function rankInfo(vals, v, lowerBetter){
  const xs = vals.filter(x=>x!=null);
  if(v==null || xs.length<2) return null;
  const better = xs.filter(x => lowerBetter ? x<v : x>v).length;
  const worse = xs.filter(x => lowerBetter ? x>v : x<v).length;
  const ties = xs.length - better - worse - 1;
  return {pct:(worse + ties/2)/(xs.length-1), pos:better+1, n:xs.length};
}
// Two separate leagues: paid deals are ranked against paid deals, free UGC deals against free UGC deals.
const UGC_METRICS = [
  {k:"vpf",  label:"Views ÷ followers", w:.20, lower:false, fmt:pct, how:"How far the reel travelled beyond their own followers", unit:true},
  {k:"spv",  label:"Shares ÷ views",    w:.30, lower:false, fmt:pct, how:"Reel's shares ÷ its views", unit:true},
  {k:"svpv", label:"Saves ÷ views",     w:.30, lower:false, fmt:pct, how:"Reel's saves ÷ its views", unit:true},
];
const UGC_CODE = {k:"upk", label:"Code uses per 1K views", w:.15, lower:false, fmt:v=>v.toFixed(2), how:"Orders with their code ÷ reel views × 1,000"};
const isFreeDeal = k => k.price===0;
function ugcUnitMetrics(u, fol){
  return { vpf: u.views>0 && fol>0 ? u.views/fol : null, spv: u.views>0 && u.shares!=null ? u.shares/u.views : null, svpv: u.views>0 && u.saves!=null ? u.saves/u.views : null };
}
function computeScores(){
  const live = Object.entries(S.campaigns).filter(([,k])=>k.status!=="Cancelled" && k.price!=null && k.price>=0);
  const out = {};
  for(const free of [false, true]){
    const deals = live.filter(([,k])=>isFreeDeal(k)===free);
    const UM = free ? UGC_METRICS : UNIT_METRICS;
    const pool = [];
    deals.forEach(([id,k])=>{ const fol = k.followersAtPost || S.creators[k.handle]?.followers || null;
      reelUnits(k).forEach(u=>{ if(u.views>0) pool.push({id, u, m: free ? ugcUnitMetrics(u, fol) : unitMetrics(u)}); }); });
    const cols = Object.fromEntries(UM.map(M=>[M.k, pool.map(x=>x.m[M.k])]));
    pool.forEach(x=>{
      x.parts = UM.map(M=>{ const v=x.m[M.k]; if(v==null) return {...M, v:null}; const r=rankInfo(cols[M.k], v, M.lower); return r?{...M,v,...r}:{...M,v,pct:null}; });
      const used = x.parts.filter(p=>p.pct!=null), w = used.reduce((a,p)=>a+p.w,0);
      x.score = w ? 100*used.reduce((a,p)=>a+p.w*p.pct,0)/w : null;
    });
    const codeVal = k => { if(!k.hasCode || k.orders==null) return null; if(free) return k.views>0 ? k.orders/k.views*1000 : null; return campMetrics(k).cpo; };
    const codeVals = deals.map(([,k])=>codeVal(k));
    const CODE = free ? UGC_CODE : METRICS[4];
    deals.forEach(([id,k])=>{
      const units = pool.filter(x=>x.id===id && x.score!=null);
      if(!units.length){ out[id]=null; return; }
      const content = units.reduce((a,x)=>a+x.score,0)/units.length;
      const parts = [{k:"content", label: units.length>1 ? `Average of ${units.length} reels` : (units[0].u.combined && units[0].u.n>1 ? `All ${units[0].u.n} reels combined` : "Reel"), w:.80, pct:content/100, v:content}];
      const cv = codeVal(k), r = rankInfo(codeVals, cv, CODE.lower);
      parts.push(cv==null ? {...CODE, v:null} : r ? {...CODE, v:cv, ...r} : {...CODE, v:cv, pct:null});
      const ot = k.onTime==null ? null : (k.onTime?1:0);
      parts.push(ot==null ? {...METRICS[5], v:null} : {...METRICS[5], v:ot, pct:ot});
      const used = parts.filter(p=>p.pct!=null), wsum = used.reduce((a,p)=>a+p.w,0);
      used.forEach(p=>{ p.eff=p.w/wsum; p.pts=100*p.eff*p.pct; });
      out[id] = {score: Math.round(used.reduce((a,p)=>a+p.pts,0)), parts, units, wsum, free};
    });
  }
  return out;
}

let SCORES = {}, CSCORE = {}, LAST = {};
function recompute(){
  const raw = computeScores();
  SCORES = {}; CSCORE = {}; LAST = {};
  for(const [id,s] of Object.entries(raw)) SCORES[id] = s ? s.score : null;
  recompute.detail = raw;
  for(const [id,k] of Object.entries(S.campaigns)){
    const h=k.handle;
    if(SCORES[id]!=null){ (CSCORE[h] ||= {sum:0,n:0,ids:[]}); CSCORE[h].sum+=SCORES[id]; CSCORE[h].n++; CSCORE[h].ids.push(id); }
    const bk = BNAME[k.brand]; const d = lastDate(k);
    if(bk && d && k.status!=="Cancelled"){ LAST[h] ||= {}; if(!LAST[h][bk] || d>LAST[h][bk]) LAST[h][bk]=d; }
  }
  for(const h in CSCORE) CSCORE[h].score = Math.round(CSCORE[h].sum/CSCORE[h].n);
}
// Two rest periods: the same brand (default 6 weeks) and any Percent Labs brand (default 2 weeks).
function coolInfo(h, bk){
  const wk = Number(S.settings.cooldownWeeks ?? 6), xd = Number(S.settings.crossDays ?? 14);
  const out = [];
  const d = LAST[h]?.[bk];
  if(d){ const u=addDays(d, wk*7); if(u>TODAY) out.push({until:u, why:`posted for ${BRANDS.find(b=>b.key===bk)?.name} on ${fmtDs(d)}`, kind:"brand"}); }
  const all = Object.entries(LAST[h]||{}).sort((a,b)=>b[1].localeCompare(a[1]))[0];
  if(all){ const u=addDays(all[1], xd); if(u>TODAY) out.push({until:u, why:`just posted for ${BRANDS.find(b=>b.key===all[0])?.name} on ${fmtDs(all[1])}`, kind:"group"}); }
  if(!out.length) return null;
  return out.sort((a,b)=>b.until-a.until)[0];
}
function cooldownFor(h, bk){ return coolInfo(h,bk)?.until || null; }
function groupCool(h){ const xd=Number(S.settings.crossDays ?? 14); const all=Object.entries(LAST[h]||{}).sort((a,b)=>b[1].localeCompare(a[1]))[0]; if(!all) return null; const u=addDays(all[1],xd); return u>TODAY?{until:u, brand:BRANDS.find(b=>b.key===all[0])?.name, d:all[1]}:null; }
function breakdownHTML(id){
  const d = recompute.detail?.[id];
  if(!d) return `<p class="hint">No score yet. A deal is scored once it has a price and at least one reel's views.</p>`;
  const cell = p => p.v==null ? `<span class="hint">—</span>` : `${esc(p.fmt(p.v))}${p.pos?`<small>${p.pos}/${p.n}</small>`:""}`;
  const k = S.campaigns[id];
  const UM = d.free ? UGC_METRICS : UNIT_METRICS;
  return `${d.free?`<p class="hint" style="margin:0 0 6px"><span class="pill ugc">UGC league</span> Free deal, so it's ranked only against other free deals, on reach and engagement instead of cost.</p>`:""}<div class="tablewrap" style="border-radius:8px"><table class="reeltbl"><thead><tr><th>Reel</th>${UM.map(M=>`<th class="r">${esc(M.label.replace("Cost per","$/").replace(" views",""))}</th>`).join("")}<th class="r">Score</th></tr></thead><tbody>
    ${d.units.map(x=>`<tr style="cursor:default"><td>${x.u.combined&&x.u.n>1?`${x.u.n} reels combined`:`Reel ${x.u.i+1}`} <span class="hint">${esc(fmtDs(x.u.date))} · ${fmtN(x.u.views)} views</span></td>${x.parts.map(p=>`<td class="r num">${cell(p)}</td>`).join("")}<td class="r num"><b style="color:${scoreColor(x.score)}">${Math.round(x.score)}</b></td></tr>`).join("")}
  </tbody></table></div>
  <div class="bk" style="margin-top:10px"><div class="bkh"><span>Part</span><span>Result</span><span>Rank</span><span>Weight</span><span>Points</span></div>
    ${d.parts.map(p=>`<div class="${p.pct==null?"off":""}"><span>${esc(p.label)}</span><span class="num">${p.k==="content"?Math.round(p.v):p.v==null?"—":esc(p.fmt(p.v))}</span>
      <span class="num">${p.k==="content"?"reel score":p.pct==null?(p.v==null?(p.k==="cpo"?"no code / not logged":"not logged"):"only one so far"):p.fixed?"—":`${p.pos} of ${p.n}`}</span>
      <span class="num">${p.pct==null?`<s>${Math.round(p.w*100)}%</s>`:`${(p.eff*100).toFixed(p.eff*100%1?1:0)}%`}</span><span class="num">${p.pct==null?"—":p.pts.toFixed(1)}</span></div>`).join("")}
    <div class="bkt"><span>Deal score</span><span></span><span></span><span></span><span class="num">${d.score}</span></div></div>
  <p class="hint" style="margin:6px 0 0">${d.free?"":"Each reel gets an equal share of the deal price"}${!d.free&&k?.price&&d.units.length>1?` (${fmt$(k.price/d.units.length)} each). `:d.free?"":". "} Small numbers show the reel's rank among all reels. <button class="linkbtn" type="button" data-guide>How scoring works</button></p>`;
}

const EMAIL_DOMAIN = "creators.percent-labs.com";
const cid = h => /^__.*__$/.test(h) ? "~"+h : h;           // Firestore reserves ids like __x__
const cdoc = h => db.collection("creators").doc(cid(h));
let FB = null, unsubs = [];
function initFirebase(){
  if(FB) return FB;
  if(!window.firebase || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){ fail("Firebase isn't set up yet: add your project settings to firebase-config.js."); return null; }
  const app = firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs = firebase.firestore();
  fs.settings({ignoreUndefinedProperties:true, merge:true});
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});   // cache on this device = fewer reads
  FB = {app, fs, auth: firebase.auth()};
  return FB;
}
async function boot(){
  if(!initFirebase()) return;
  db = FB.fs;
  unsubs.forEach(u=>u()); unsubs = [];
  unsubs.push(db.collection("creators").limit(1000).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{ const x=d.data(); const h=x.handle||d.id.replace(/^~/,""); o[h]={...x, handle:h}; });
    for(const c of Object.values(o)){ const b={}; for(const [k,v] of Object.entries(c.brands||{})) b[k]=normStatus(v); c.brands=b; }
    S.creators=o; S.loaded.c=true; recompute(); render();
  }, e=>toast("Lost the live connection to creators. Reload the page.")));
  unsubs.push(db.collection("campaigns").limit(1000).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); });
    S.campaigns=o; S.loaded.k=true; recompute(); render();
  }, e=>toast("Lost the live connection to campaigns. Reload the page.")));
  unsubs.push(db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ S.settings={cooldownWeeks:6, crossDays:14, ...s.data()}; recompute(); render(); } }));
}
function fail(t){ $("#main").innerHTML = `<div class="notice">${esc(t||"Couldn't reach the database. Check your connection and reload.")}</div>`; }

/* ---------- Render ---------- */
function render(){
  if(!(S.loaded.c && S.loaded.k)) return;
  const nC = Object.keys(S.creators).length;
  $("#nCreators").textContent = nC;
  const nDue = Object.values(S.campaigns).filter(k=>dueInfo(k)?.state==="due").length;
  const nc=$("#nCamps"); nc.textContent = nDue ? nDue+" due" : Object.keys(S.campaigns).length; nc.style.color = nDue ? "var(--bad)" : "";
  const tc = todayCounts(); $("#nToday").textContent = (tc.due+tc.fu) || "";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  if(!nC && !Object.keys(S.campaigns).length){
    $("#main").innerHTML = `<div class="notice">No creators yet. Use <b>+ Creator</b> to onboard the first one.</div>`; return;
  }
  if(S.tab==="guide") S.tab="playbook";
  if(!S.me) return;
  if(S.tab==="admin" && !isAdmin()) S.tab="find";
  ({today:renderToday, find:renderFind, board:renderBoard, campaigns:renderCampaigns, followers:renderFollowers, playbook:renderPlaybook, admin:renderAdmin}[S.tab]||renderToday)();
}

const PLATFORMS = ["Instagram","TikTok","Facebook","YouTube"];
const platUrl = (p,h) => ({Instagram:`https://www.instagram.com/${encodeURIComponent(h)}/`, TikTok:`https://www.tiktok.com/@${encodeURIComponent(h)}`, Facebook:`https://www.facebook.com/${encodeURIComponent(h)}`, YouTube:`https://www.youtube.com/@${encodeURIComponent(h)}`})[p];
function platformsOf(c){
  if(c && c.platforms && typeof c.platforms==="object" && Object.keys(c.platforms).length) return c.platforms;
  const p = (c&&c.platform) || "Instagram", o = {};
  PLATFORMS.forEach(x=>{ if(p.includes(x)) o[x] = {followers: (p===x ? c.followers : x==="Instagram" ? c.followers : null) ?? null}; });
  if(!Object.keys(o).length) o.Instagram = {followers: c?.followers ?? null};
  return o;
}
const mainPlatform = c => { const ps=platformsOf(c); return ps.Instagram ? "Instagram" : Object.keys(ps)[0]; };
const profileHref = h => { const c=S.creators[h]; if(!c) return platUrl("Instagram",h); const p=mainPlatform(c); return platUrl(p, platformsOf(c)[p]?.handle || h); };
const igUrl = h => profileHref(h);
const igLink = (h, cls="") => { const c=S.creators[h]; const p=c?mainPlatform(c):"Instagram"; return `<a class="hl ${cls}" href="${esc(profileHref(h))}" target="_blank" rel="noopener" title="Open @${esc(h)} on ${p}">@${esc(h)}<span aria-hidden="true" class="ext">↗</span></a>`; };
function platformLinks(c){
  const ps = platformsOf(c);
  return Object.entries(ps).map(([p,v])=>`<a class="plink" href="${esc(platUrl(p, v.handle||c.handle))}" target="_blank" rel="noopener">${p}<b class="num">${fmtN(v.followers)}</b></a>`).join("");
}
function brandDeals(h, bk){
  const name = BRANDS.find(b=>b.key===bk).name;
  return Object.values(S.campaigns).filter(k=>k.handle===h && k.brand===name && k.status!=="Cancelled");
}
// One aligned cell per brand: status, deal count, last post, cooldown.
function brandCell(c, bk){
  const st = c.brands?.[bk] || "none";
  const deals = brandDeals(c.handle, bk);
  const last = LAST[c.handle]?.[bk];
  const cool = cooldownFor(c.handle, bk);
  const label = deals.length ? `${deals.length} deal${deals.length>1?"s":""}` : SLABEL[st];
  const cls = deals.length ? "worked" : st;
  const sub = cool ? `cooldown to ${fmtDate(cool)}` : last ? `last ${fmtDs(last)}` : "";
  return `<span class="bc ${cls}"><b>${esc(label)}</b>${sub?`<small>${esc(sub)}</small>`:""}</span>`;
}
function brandStatusHTML(c, only){
  return `<div class="bstat">${BRANDS.filter(b=>!only||b.key===only).map(b=>`<span class="bs-mini"><i style="background:${b.c}"></i>${brandCell(c,b.key)}</span>`).join("")}</div>`;
}

/* League switch (All / Paid / UGC), shared by Find creators, Leaderboard and Deals. */
const LEAGUES = [["all","All"],["paid","Paid"],["ugc","UGC (free)"]];
const leagueHTML = () => `<div class="league" role="group" aria-label="Paid or UGC">${LEAGUES.map(([v,l])=>`<button type="button" data-lg="${v}" aria-pressed="${(S.league||"all")===v}">${l}</button>`).join("")}</div>`;
const wireLeague = rerender => document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{ S.league=b.dataset.lg; S.shown=60; rerender(); });
// Paid and UGC deals are scored in separate groups, so a creator can hold one score of each kind. They're never averaged together.
function leagueScoreOf(h, lg){
  lg = lg || S.league || "all";
  if(lg==="all"){ const P=leagueScoreOf(h,"paid"), U=leagueScoreOf(h,"ugc"); if(P&&U) return P.score>=U.score?P:U; return P||U||null; }
  const ids=(CSCORE[h]?.ids||[]).filter(id=>(recompute.detail[id]?.free ? "ugc" : "paid")===lg);
  if(!ids.length) return null; return {ids, n:ids.length, lg, score:Math.round(ids.reduce((a,id)=>a+SCORES[id],0)/ids.length)};
}
const ugcStar = h => { const U=leagueScoreOf(h,"ugc"); return U && U.score>=65 && !leagueScoreOf(h,"paid") && !Object.values(S.campaigns).some(k=>k.handle===h && k.price>0 && k.status!=="Cancelled"); };
// A creator is UGC if they've done a free deal or offer a $0 package; Paid if they've done a paid deal or quote a price. Some are both.
function creatorLeagues(c){
  if(c.league==="paid") return {paid:true, ugc:false};
  if(c.league==="ugc") return {paid:false, ugc:true};
  const ks = Object.values(S.campaigns).filter(k=>k.handle===c.handle && k.status!=="Cancelled" && k.price!=null);
  const ps = packagesOf(c);
  const paid = ks.some(k=>k.price>0) || ps.some(p=>p.price>0) || (lastPaid(c.handle)>0);
  // For now: anyone with no paid deal or quoted price counts as UGC.
  return { paid, ugc: ks.some(k=>k.price===0) || ps.some(p=>p.price===0) || !paid };
}
/* Sortable tables: click a header to sort, click again to flip. Empty values always sit at the bottom. */
function sortRows(rows, cols, st){
  if(!st || !st.k) return rows;
  const col = cols.find(c=>c.k===st.k); if(!col || !col.v) return rows;
  const empty = x => x==null || x==="" || (typeof x==="number" && Number.isNaN(x));
  return rows.slice().sort((a,b)=>{
    const x=col.v(a), y=col.v(b);
    if(empty(x) && empty(y)) return 0; if(empty(x)) return 1; if(empty(y)) return -1;
    const r = typeof x==="string" ? x.localeCompare(y) : (x===y ? 0 : x<y ? -1 : 1);
    return st.dir==="asc" ? r : -r;
  });
}
function theadHTML(cols, st, tbl){
  return `<thead><tr>${cols.map(c=>{
    if(!c.v) return `<th class="${c.r?"r":""}">${c.label}</th>`;
    const on = st && st.k===c.k;
    return `<th class="${c.r?"r":""}" aria-sort="${on?(st.dir==="asc"?"ascending":"descending"):"none"}"><button type="button" class="sortbtn" data-tbl="${tbl}" data-sort="${c.k}" title="Sort by ${esc(c.label)}">${c.label}<span class="si" aria-hidden="true">${on?(st.dir==="asc"?"▲":"▼"):"↕"}</span></button></th>`;
  }).join("")}</tr></thead>`;
}
function wireSort(cols, key, rerender){
  document.querySelectorAll(`[data-tbl="${key}"]`).forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const k=b.dataset.sort, cur=S[key], col=cols.find(c=>c.k===k);
    S[key] = cur && cur.k===k ? {k, dir: cur.dir==="asc"?"desc":"asc"} : {k, dir: col.def || (col.text ? "asc" : "desc")};
    rerender();
  });
}

/* Rate card: each creator has a list of packages {reels, stories, price, quotedOn, note}. Price 0 = free UGC. */
function packagesOf(c){
  if(Array.isArray(c.packages)) return c.packages.filter(p=>p && p.price!=null && ((p.reels||0)+(p.stories||0))>0);
  const out=[]; if(c.rateReel!=null) out.push({reels:1,stories:0,price:c.rateReel}); if(c.rateStory!=null) out.push({reels:0,stories:1,price:c.rateStory}); return out;
}
const pkgName = p => [p.reels?`${p.reels} reel${p.reels>1?"s":""}`:"", p.stories?`${p.stories} stor${p.stories>1?"ies":"y"}`:""].filter(Boolean).join(" + ");
const pkgShort = p => [p.reels?`${p.reels} reel${p.reels>1?"s":""}`:"", p.stories?`${p.stories} stor${p.stories>1?"ies":"y"}`:""].filter(Boolean).join(" + ");
const priceTxt = v => v===0 ? "Free" : fmt$(v,0);
const cheapest = c => { const ps=packagesOf(c); return ps.length ? ps.reduce((a,p)=>p.price<a.price?p:a) : null; };
const isFree = c => packagesOf(c).some(p=>p.price===0);
const rateValue = c => { const ch=cheapest(c); return ch ? ch.price : null; };
function rateHTML(c){
  const ps = packagesOf(c);
  if(!ps.length) return `<span class="hint">No prices yet</span>`;
  const ch = cheapest(c);
  const tip = ps.map(p=>`${pkgName(p)}: ${priceTxt(p.price)}${p.quotedOn?` (quoted ${fmtD(p.quotedOn)})`:""}`).join("\n");
  return `<span class="rate" title="${esc(tip)}"><b>${ch.price===0?`<span class="free">Free · UGC</span>`:`from ${fmt$(ch.price,0)}`}</b><small>${esc(pkgShort(ch))}${ps.length>1?` · ${ps.length} packages`:""}</small></span>`;
}
function rateText(c){ const ch=cheapest(c); return ch ? `${priceTxt(ch.price)} · ${pkgName(ch)}` : (c.rateNote || "—"); }

const STATUS_RANK = {worked:0, interested:1, want:2, contacted:3, none:4, declined:5};

function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase().replace(/^@/,"");
  const maxRate = parseFloat(f.maxRate);
  return Object.values(S.creators).filter(c=>{
    if(q && !(c.handle.includes(q) || (c.name||"").toLowerCase().includes(q) || (c.notes||"").toLowerCase().includes(q))) return false;
    if(f.cats.size && !f.cats.has(c.category)) return false;
    if(f.tiers.size && !f.tiers.has(tierOf(c.followers))) return false;
    if(f.platform && !platformsOf(c)[f.platform]) return false;
    if(!isNaN(maxRate)){ const r = rateValue(c); if(r!=null && r>maxRate) return false; }
    if(f.show==="dnb") return !!c.dnb;
    if(c.dnb) return false;
    const keys = f.brand ? [f.brand] : BRANDS.map(b=>b.key);
    const sts = keys.map(k=>stFor(c,k));
    switch(f.show){
      case "all": if(f.brand && sts[0]==="declined") return false; break;
      case "worked": if(!sts.includes("worked")) return false; break;
      case "rebook": if(!((leagueScoreOf(c.handle)?.score??0)>=65 && keys.some(k=>!cooldownFor(c.handle,k)))) return false; break;
      case "ugcstar": if(!ugcStar(c.handle)) return false; break;
      case "cross": { const wb=workedBrands(c); if(!wb.length || (f.brand ? wb.includes(f.brand) : wb.length===BRANDS.length)) return false; break; }
      case "free": if(!isFree(c)) return false; break;
      default: if(!sts.includes(f.show)) return false;
    }
    if(f.brand && f.hideCool && cooldownFor(c.handle,f.brand)) return false;
    return true;
  });
}

  const e = {cpm:ext("cpm"), cps:ext("cps"), spv:ext("spv"), cpsv:ext("cpsv")};

    <div class="resultline"><b>${rows.length} of ${nAll} deal${nAll!==1?"s":""}</b>${nDue?`<button type="button" class="fpill due-pill" id="showDue">${nDue} need${nDue>1?"":"s"} results</button>`:""}${(DF.q||DF.brands.size||DF.stage)?`<button type="button" class="linkbtn" id="dClear">Clear filters</button>`:""}<button type="button" class="btn ghost colsbtn" id="dAll" aria-pressed="${!!S.dAll}">${S.dAll?"Fewer columns":"Show all metrics"}</button></div>

/* ---------- Business rules added in the QC round ---------- */
const FOLLOWUP_DAYS = 5, PROVISIONAL_MIN = 10;
const statusSince = (c,bk) => c.brandsAt?.[bk] || (c.addedFrom==="UGC sheet" ? IMPORT_DATE : c.onboardedOn) || IMPORT_DATE;
function followUps(){
  const out=[];
  for(const c of Object.values(S.creators)){
    if(c.dnb) continue;
    for(const b of BRANDS){ if((c.brands?.[b.key])!=="contacted") continue; const d=daysSince(statusSince(c,b.key)); if(d>=FOLLOWUP_DAYS) out.push({c,b,d}); }
  }
  return out.sort((a,b)=>b.d-a.d);
}
function leagueCounts(){ let paid=0, ugc=0; for(const s of Object.values(recompute.detail||{})){ if(!s) continue; s.free?ugc++:paid++; } return {paid, ugc}; }
const spendMonth = k => { const d = firstDate(k) || k.bookedOn; return d ? d.slice(0,7) : null; };
const thisMonth = () => iso(TODAY).slice(0,7);
const monthName = ym => new Date(ym+"-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
function brandSpend(bk, ym, exceptId){ const name=BRANDS.find(b=>b.key===bk)?.name; return Object.entries(S.campaigns).filter(([id,k])=>id!==exceptId && k.brand===name && k.status!=="Cancelled" && spendMonth(k)===ym).reduce((a,[,k])=>a+(k.price||0),0); }
function codeTaken(code, exceptId){ if(!code) return null; const c=code.trim().toLowerCase(); return Object.entries(S.campaigns).find(([id,k])=>id!==exceptId && k.status!=="Cancelled" && k.hasCode && (k.promoCode||"").trim().toLowerCase()===c) || null; }
const activeCreator = c => !c.dnb && (Object.values(c.brands||{}).some(v=>v && v!=="none" && v!=="declined") || Object.values(S.campaigns).some(k=>k.handle===c.handle));
function scoreHTML(h){
  const one = (cs, tag) => { const [cls,lab]=verdict(cs.score), n=leagueCounts(); const prov = cs.lg==="ugc" ? n.ugc<PROVISIONAL_MIN : n.paid<PROVISIONAL_MIN;
    return `<span class="score${prov?" prov":""}" title="${cs.lg==="ugc"?"UGC score":"Paid score"}: average of ${cs.n} deal${cs.n>1?"s":""}${prov?`. Early score: fewer than ${PROVISIONAL_MIN} ${cs.lg==="ugc"?"UGC":"paid"} deals to compare with so far`:""}"><span class="sc-l"><span class="pill ${cls}">${tag?`${tag} · `:""}${lab}</span><small>${cs.n} deal${cs.n>1?"s":""}${prov?" · early":""}</small></span><span class="ring" style="--p:${cs.score};--sc:${scoreColor(cs.score)}"><span>${cs.score}</span></span></span>`; };
  const lg = S.league || "all";
  if(lg!=="all"){ const cs=leagueScoreOf(h,lg); return cs ? one(cs) : `<span class="untested">${lg==="ugc"?"No UGC deal yet":"No paid deal yet"}</span>`; }
  const P=leagueScoreOf(h,"paid"), U=leagueScoreOf(h,"ugc");
  if(P && U) return `<span class="dual">${one(P,"Paid")}${one(U,"UGC")}</span>`;
  if(P||U) return one(P||U, U&&!P?"UGC":"");
  return `<span class="untested">Untested</span>`;
}

  const due = Object.values(S.campaigns).filter(k=>dueInfo(k)?.state==="due").length;
  return {due, fu: followUps().length};
}
function todayData(){
  const today=iso(TODAY), wk=iso(addDays(today,6));
  const due = Object.entries(S.campaigns).filter(([,k])=>dueInfo(k)?.state==="due").map(([id,k])=>({id,k,di:dueInfo(k)}));
  const fu = followUps();
  const week=[]; for(const [id,k] of Object.entries(S.campaigns)){ if(k.status==="Cancelled") continue; for(const d of delivs(k)) if(d.date>=today && d.date<=wk) week.push({id,k,d}); }
  week.sort((a,b)=>a.d.date.localeCompare(b.d.date));
  const noLink=[]; for(const [id,k] of Object.entries(S.campaigns)){ if(k.status==="Cancelled") continue; for(const d of delivs(k)) if(d.type==="Reel" && d.date<=today && d.date>=iso(addDays(today,-14)) && !d.url) noLink.push({id,k,d}); }
  const active = Object.values(S.creators).filter(activeCreator);
  const staleF = active.filter(c=>daysSince(c.followersUpdated)>31);
  const generic = Object.values(S.creators).filter(c=>!c.dnb && c.category==="General creator");
  const checkTypes = Object.entries(S.campaigns).filter(([,k])=>k.typesToCheck && k.status!=="Cancelled");
  return {today, due, fu, week, noLink, active, staleF, generic, checkTypes};
}

function followUpMode(start){
  let queue = followUps(), i = Math.min(start||0, queue.length-1), done = 0;
  const show = () => {
    if(!queue.length || i>=queue.length){
      drawer(`<div class="dhead"><div><h2>All done</h2><div class="sub">${done} follow-up${done!==1?"s":""} handled.</div></div><button class="btn ghost x" type="button" data-close aria-label="Close">✕</button></div>
        <div class="dbody"><div class="t2-clear big"><span>✓</span><div><b>Nobody left waiting.</b><small>New follow-ups appear on Today ${FOLLOWUP_DAYS} days after you contact someone.</small></div></div></div>
        <div class="dfoot"><span class="sp"></span><button class="btn primary" type="button" data-close>Back to Today</button></div>`);
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>render()));
      return;
    }
    const {c,b,d} = queue[i]; const ph=c.phone; const nx=queue[i+1];
    drawer(`<div class="dhead"><div style="min-width:0"><div class="fu-prog"><span style="width:${(i)/queue.length*100}%"></span></div><div class="sub">Follow-up ${i+1} of ${queue.length}</div></div><button class="btn ghost x" type="button" data-close aria-label="Close">✕</button></div>
      <div class="dbody fu-card">
        <div class="fu-q">Did they reply? Swipe right for yes, left for no.</div>
        <div class="sw-stack">
          ${nx?`<div class="sw-card sw-next" aria-hidden="true"><div class="fu-who"><span class="fu-brand" style="--bc:${nx.b.c}"><i class="dot" style="background:${nx.b.c}"></i>${esc(nx.b.name)}</span><h2>@${esc(nx.c.handle)}</h2></div></div>`:""}
          <div class="sw-card" id="swCard" tabindex="0" aria-label="Follow-up card for @${esc(c.handle)}. Right arrow: interested. Left arrow: not interested. N: nudged again.">
            <span class="sw-stamp yes">Interested</span><span class="sw-stamp no">Not interested</span><span class="sw-stamp nudge">Nudged again</span>
            <div class="fu-who"><span class="fu-brand" style="--bc:${b.c}"><i class="dot" style="background:${b.c}"></i>${esc(b.name)}</span>
              <h2>${igLink(c.handle,"big")}</h2>
              <p>${c.name?esc(c.name)+" · ":""}${esc(c.category)} · ${fmtN(c.followers)} followers</p>
              <p class="fu-wait">Contacted ${d} days ago, no reply logged</p></div>
            <div class="fu-reach">${ph&&ph.num?`<a class="btn" href="${esc(waUrl(ph))}" target="_blank" rel="noopener">WhatsApp ↗</a>`:`<span class="hint">No phone saved.</span>`}<a class="btn" href="${esc(profileHref(c.handle))}" target="_blank" rel="noopener">Instagram ↗</a></div>
          </div>
        </div>
        <div class="sw-btns">
          <button type="button" class="sw-b no" data-a="declined" aria-label="Not interested"><span>✕</span><small>Not interested</small></button>
          <button type="button" class="sw-b nudge" data-a="contacted" aria-label="Nudged again"><span>↻</span><small>Nudged again</small></button>
          <button type="button" class="sw-b ok" data-a="interested" aria-label="Interested"><span>✓</span><small>Interested</small></button>
        </div>
        <p class="sw-hint">Nudged again asks you again in ${FOLLOWUP_DAYS} days. Interested means add their prices next.</p>
      </div>
      <div class="dfoot"><button class="btn ghost" type="button" id="fuBack" ${i===0?"disabled":""}>← Back</button><span class="sp"></span><button class="btn ghost" type="button" id="fuSkip">Skip for now</button></div>`);
    document.querySelectorAll("[data-close]").forEach(x=>x.addEventListener("click",()=>{ document.removeEventListener("keydown",onKey); render(); }));
    $("#fuBack").onclick=()=>{ document.removeEventListener("keydown",onKey); i=Math.max(0,i-1); show(); };
    $("#fuSkip").onclick=()=>{ document.removeEventListener("keydown",onKey); i++; show(); };
    const card=$("#swCard"); let busy=false;
    const stamp=(dx,dy)=>{ card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,dx/110)); card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-dx/110)); card.querySelector(".nudge").style.opacity=Math.max(0,Math.min(1,-dy/110)); };
    const act=async(a)=>{ if(busy) return; busy=true; document.removeEventListener("keydown",onKey);
      document.querySelectorAll(".sw-b").forEach(x=>x.disabled=true);
      const fly = a==="interested"?"translate(140%,0) rotate(18deg)":a==="declined"?"translate(-140%,0) rotate(-18deg)":"translate(0,-120%)";
      card.style.transition="transform .28s ease, opacity .28s ease"; card.style.transform=fly; card.style.opacity="0";
      stamp(a==="interested"?200:a==="declined"?-200:0, a==="contacted"?-200:0);
      const [ok]=await Promise.all([setBrandStatus(c.handle, b.key, a), new Promise(r=>setTimeout(r,280))]);
      if(ok){ done++; S.doneCount++; queue.splice(i,1); show(); }
      else { busy=false; card.style.transform=""; card.style.opacity=""; stamp(0,0); document.querySelectorAll(".sw-b").forEach(x=>x.disabled=false); document.addEventListener("keydown",onKey); }
    };
    function onKey(e){ if(e.target.closest("input,textarea,select")) return; if(e.key==="ArrowRight"){e.preventDefault();act("interested");} else if(e.key==="ArrowLeft"){e.preventDefault();act("declined");} else if(e.key==="n"||e.key==="N"||e.key==="ArrowUp"){e.preventDefault();act("contacted");} }
    document.addEventListener("keydown",onKey);
    document.querySelectorAll(".sw-b").forEach(x=>x.onclick=()=>act(x.dataset.a));
    let sx=0, sy=0, dx=0, dy=0, drag=false, pid=null;
    card.addEventListener("pointerdown",e=>{ if(busy||e.target.closest("a,button")) return; pid=e.pointerId; sx=e.clientX; sy=e.clientY; dx=dy=0; drag=true; card.setPointerCapture(pid); card.style.transition="none"; });
    card.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==pid) return; dx=e.clientX-sx; dy=Math.min(0,e.clientY-sy); card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`; stamp(dx, Math.abs(dx)<60?dy:0); });
    const end=e=>{ if(!drag) return; drag=false; try{card.releasePointerCapture(pid);}catch(_){}
      if(dx>110) act("interested"); else if(dx<-110) act("declined"); else if(dy<-110 && Math.abs(dx)<60) act("contacted");
      else { card.style.transition="transform .2s ease"; card.style.transform=""; stamp(0,0); } };
    card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
  };
  show();
}
async function setBrandStatus(h, bk, v){
  const c=S.creators[h]; if(!c) return false; const name=BRANDS.find(b=>b.key===bk).name, prev=c.brands?.[bk]||"none", today=iso(TODAY);
  const summary = prev===v && v==="contacted" ? `@${h} · ${name}: followed up again` : `@${h} · ${name}: ${SLABEL[prev]} → ${SLABEL[v]}`;
  const ok = await write(()=>cdoc(h).update({["brands."+bk]:v, ["brandsAt."+bk]:today}), prev===v&&v==="contacted" ? `@${h}: we'll remind you in ${FOLLOWUP_DAYS} days` : `@${h} · ${name}: ${SLABEL[v]}`, {act:"status", summary, ref:{creator:h}});
  if(ok){ c.brands = {...(c.brands||{}), [bk]:v}; c.brandsAt = {...(c.brandsAt||{}), [bk]:today}; }
  return ok;
}

/* Follower updates */
function renderFollowers(){
  const all = Object.values(S.creators);
  const rel = c => (CSCORE[c.handle]?0:1)*10 + Math.min(...BRANDS.map(b=>STATUS_RANK[c.brands?.[b.key]||"none"]));
  let list = all.filter(c=>S.fShow==="all" || Math.min(...BRANDS.map(b=>STATUS_RANK[c.brands?.[b.key]||"none"]))<=3);
  list.sort((a,b)=>(daysSince(b.followersUpdated)>31)-(daysSince(a.followersUpdated)>31) || rel(a)-rel(b) || (b.followers||0)-(a.followers||0));
  const fresh = list.filter(c=>daysSince(c.followersUpdated)<=31).length;
  $("#main").innerHTML = `
  <div class="section">
    <button type="button" class="linkbtn" id="backToday" style="margin-bottom:8px">← Back to Today</button>
    <h2>Monthly follower check</h2>
    <p class="lede">Type the current count (e.g. 112k or 1.2M) and press Enter. Each save keeps a history, so growth and sudden jumps show up on the creator's profile. Anything older than a month is marked due.</p>
    <div class="settingsline">
      <span><span class="num">${fresh}</span> of <span class="num">${list.length}</span> up to date</span>
      <select id="fShow" class="in" style="width:auto"><option value="priority" ${S.fShow==="priority"?"selected":""}>Active creators (worked with, open, quoted, pending)</option><option value="all" ${S.fShow==="all"?"selected":""}>Everyone</option></select>
    </div>
    <div class="progress"><i style="width:${list.length?fresh/list.length*100:0}%"></i></div>
    <div class="list fupd">${list.slice(0,150).map(c=>{
      const d=daysSince(c.followersUpdated);
      return `<div class="frow"><div class="who" style="min-width:0"><span class="h">${igLink(c.handle)}</span><span class="sub">${esc(c.category)}${CSCORE[c.handle]?` · score ${CSCORE[c.handle].score}`:""}</span></div>
        <div class="f-old"><span class="num">${fmtN(c.followers)}</span> <span class="${d>31?"stale":"fresh"}">${d===Infinity?"never":d>31?`${d}d ago · due`:`${d}d ago`}</span></div>
        <input aria-label="New follower count for @${esc(c.handle)}" data-fh="${esc(c.handle)}" placeholder="${esc(c.followers!=null?String(c.followers):"e.g. 45200")}" inputmode="numeric">
        <button class="btn" type="button" data-fsave="${esc(c.handle)}">Save</button></div>`;}).join("")}</div>
    ${list.length>150?`<p class="hint">Showing the first 150 by priority. Saved rows move down the list.</p>`:""}
  </div>`;
  $("#fShow").addEventListener("change",e=>{S.fShow=e.target.value; renderFollowers();});
  $("#backToday").onclick=()=>{ S.tab="today"; render(); window.scrollTo({top:0}); };
  const save = async h=>{
    const inp = document.querySelector(`[data-fh="${CSS.escape(h)}"]`); const n=parseFollowers(inp.value);
    if(n==null) return; if(isNaN(n)){ toast(FOLLOW_MSG); return; }
    const c=S.creators[h]; const today=iso(TODAY);
    const hist=[...(c.history||[]).filter(x=>x.d!==today), {d:today,f:n}].slice(-36);
    await write(()=>cdoc(h).update({followers:n, followersUpdated:today, history:hist}), `@${h}: ${fmtN(n)} followers saved`, {act:"followers", summary:`@${h}: ${fmtN(c.followers)} → ${fmtN(n)} followers`, ref:{creator:h}});
  };
  document.querySelectorAll("[data-fsave]").forEach(b=>b.onclick=()=>save(b.dataset.fsave));
  document.querySelectorAll("[data-fh]").forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") save(i.dataset.fh); }));
}

function drawer(html){

function sparkline(hist){
  const h=(hist||[]).filter(x=>x.f!=null); if(h.length<2) return `<p class="hint">One reading so far (${h[0]?esc(h[0].d):"none"}). The growth line appears after next month's update.</p>`;
  const W=500,H=60,P=6, xs=h.map((_,i)=>P+i*(W-2*P)/(h.length-1)), lo=Math.min(...h.map(x=>x.f)), hi=Math.max(...h.map(x=>x.f)), r=hi-lo||1;
  const ys=h.map(x=>H-P-(x.f-lo)/r*(H-2*P)); const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const ch=(h.at(-1).f-h[0].f)/h[0].f;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="${P},${H} ${pts} ${W-P},${H}" fill="var(--ember)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--ember)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${xs.at(-1)}" cy="${ys.at(-1)}" r="3.5" fill="var(--ember)"/></svg>
  <p class="hint">${esc(h[0].d)} → ${esc(h.at(-1).d)}: <span class="num">${ch>=0?"+":""}${(ch*100).toFixed(1)}%</span>${Math.abs(ch)>0.3&&h.length<=3?" · large jump, check for bought followers":""}</p>`;
}

function pkgRow(p){
  return `<div class="pkg">
    <input class="in pk-r" type="number" min="0" max="20" value="${esc(p.reels??0)}" aria-label="Reels">
    <input class="in pk-s" type="number" min="0" max="30" value="${esc(p.stories??0)}" aria-label="Stories">
    <input class="in pk-p" type="number" min="0" step="1" value="${esc(p.price??"")}" placeholder="$" aria-label="Price in USD">
    <input class="in pk-d" type="date" min="2024-01-01" max="2030-12-31" value="${esc(p.quotedOn||"")}" aria-label="Date quoted">
    <button class="btn ghost pk-x" type="button" aria-label="Remove package">✕</button>
    <input class="in pk-n" type="text" value="${esc(p.note||"")}" placeholder="Note (optional), e.g. includes 1 TikTok" aria-label="Package note"></div>`;
}
function wirePackages(){
  const L=$("#pkgList"); if(!L) return;
  $("#addPkg").onclick=()=>{ L.insertAdjacentHTML("beforeend", pkgRow({reels:1,stories:0,price:""})); L.lastElementChild.querySelector(".pk-p").focus(); };
  $("#addFree").onclick=()=>{ L.insertAdjacentHTML("beforeend", pkgRow({reels:1,stories:0,price:0,note:"Free, tries the food"})); };
  L.addEventListener("click",e=>{ const x=e.target.closest(".pk-x"); if(x) x.closest(".pkg").remove(); });
}
function readPackages(){
  const out=[];
  for(const r of document.querySelectorAll("#pkgList .pkg")){
    const reels=r.querySelector(".pk-r").value, stories=r.querySelector(".pk-s").value, price=r.querySelector(".pk-p").value, d=r.querySelector(".pk-d").value, note=r.querySelector(".pk-n").value.trim();
    const R=Number(reels||0), St=Number(stories||0);
    if(price==="" && !note && (R+St)<=1 && !d) continue; // untouched empty line
    if(r.dataset.ob && price==="") continue; // onboarding: no price = not quoted
    if(!(Number.isInteger(R)&&Number.isInteger(St)&&R>=0&&St>=0) || R+St===0){ toast("Each package needs at least one reel or story."); return null; }
    if(price===""||Number(price)<0){ toast(`Add a price for the ${pkgName({reels:R,stories:St})} package (0 if free).`); return null; }
    if(d && (d>iso(TODAY) || d<"2024-01-01")){ toast("A package's quoted date can't be in the future."); return null; }
    out.push({reels:R, stories:St, price:Number(price), quotedOn:d||"", note});
  }
  return out;
}
function pkgPickHTML(h){
  const ps = h ? packagesOf(S.creators[h]||{}) : [];
  if(!h) return `<span>Package</span><select class="in" disabled><option>Pick the creator first</option></select>`;
  if(!ps.length) return `<span>Package</span><select class="in" disabled><option>No prices yet, type it below</option></select>`;
  return `<span>Start from their prices</span><select id="k_pkg" class="in"><option value="">Choose…</option>${ps.map((p,i)=>`<option value="${i}">${esc(pkgName(p))} · ${esc(priceTxt(p.price))}</option>`).join("")}</select>`;
}

function openCreator(h, isNew, editing){
  const c = isNew ? {handle:"",name:"",category:"General creator",platform:"Instagram",followers:null,brands:{},rateStory:null,rateReel:null,rateNote:"",notes:"",history:[]} : JSON.parse(JSON.stringify(S.creators[h]||{handle:h}));
  const edit = isNew || editing;

        ${edit ? detailsForm(c, isNew) : detailsView(c)}</div>

    </div>

      ${edit?`<button class="btn ghost" type="button" id="cancelEdit">Cancel</button><button class="btn primary" type="button" id="saveBtn">${isNew?"Onboard creator":"Save details"}</button>`:`<button class="btn ghost" type="button" data-close>Close</button>`}
    </div>`);
  $("#editDetails")?.addEventListener("click",()=>openCreator(c.handle,false,true));
  $("#cancelEdit")?.addEventListener("click",()=> isNew ? closeDrawer() : openCreator(c.handle));
  $("#logBtn")?.addEventListener("click",()=>openCampaign(null, c.handle));
  document.querySelectorAll(".drawer [data-deal]").forEach(el=>el.onclick=()=>openCampaign(el.dataset.deal));
  document.querySelectorAll("[data-bstat]").forEach(sel=>sel.addEventListener("change", async ()=>{ if(await setBrandStatus(c.handle, sel.dataset.bstat, sel.value)) openCreator(c.handle); }));
  $("#addBrand")?.addEventListener("change", async e=>{ const bk=e.target.value; if(!bk) return; if(await setBrandStatus(c.handle, bk, "want")) openCreator(c.handle); });
  $("#dnbBtn")?.addEventListener("click",()=>{
    $("#delZone").innerHTML = `<div class="confirm dnb-form"><label class="field" style="flex:1;min-width:200px"><span>Why shouldn't we book @${esc(c.handle)}?</span><input id="dnbReason" class="in" type="text" placeholder="e.g. didn't post, fake numbers, rude"></label><button class="btn" type="button" id="dnbNo">Keep</button><button class="btn danger" type="button" id="dnbYes">Flag</button></div>`;
    $("#dnbReason").focus(); $("#dnbNo").onclick=()=>$("#delZone").innerHTML="";
    $("#dnbYes").onclick=async()=>{ const r=$("#dnbReason").value.trim(); if(!r){ toast("Add a short reason so the team knows why."); return; }
      if(await write(()=>cdoc(c.handle).update({dnb:true, dnbReason:r, dnbBy:S.me?.name||"", dnbOn:iso(TODAY)}), `@${c.handle} flagged: do not book`, {act:"dnb", summary:`Flagged @${c.handle} as do not book: ${r}`, ref:{creator:c.handle}})){ Object.assign(S.creators[c.handle],{dnb:true,dnbReason:r,dnbBy:S.me?.name||"",dnbOn:iso(TODAY)}); render(); openCreator(c.handle); } };
    $("#delZone").scrollIntoView({block:"nearest"});
  });
  $("#unDnb")?.addEventListener("click", async ()=>{ if(await write(()=>cdoc(c.handle).update({dnb:false}), `@${c.handle} can be booked again`, {act:"undnb", summary:`Removed the do-not-book flag from @${c.handle}`, ref:{creator:c.handle}})){ S.creators[c.handle].dnb=false; render(); openCreator(c.handle); } });
  wirePackages(); wireOnboard();
  document.querySelectorAll(".platedit .pe-on").forEach(cb=>cb.addEventListener("change",()=>{ const r=cb.closest(".pe"); r.querySelectorAll(".pe-f,.pe-h").forEach(i=>i.disabled=!cb.checked); if(cb.checked) r.querySelector(".pe-f").focus(); }));
  $("#saveBtn")?.addEventListener("click", async ()=>{
    const handle = isNew ? ($("#e_handle").value||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/^instagram\.com\//i,"").replace(/[/?#].*$/,"").toLowerCase() : c.handle;
    if(!/^[a-z0-9_.]{1,30}$/.test(handle) || /^\.+$/.test(handle)){ toast("Enter a valid Instagram username: letters, numbers, dots and underscores."); return; }
    if(isNew && S.creators[handle]){ toast(`@${handle} is already in the roster.`); openCreator(handle); return; }
    const plats = {};
    for(const r of document.querySelectorAll(".platedit .pe")){ const cb=r.querySelector(".pe-on"); if(cb ? !cb.checked : !(r.dataset.p==="Instagram" || r.querySelector(".pe-f").value.trim() || r.querySelector(".pe-h")?.value.trim())) continue;
      const n = parseFollowers(r.querySelector(".pe-f").value); if(Number.isNaN(n)){ toast(`${r.dataset.p}: ${FOLLOW_MSG}`); r.querySelector(".pe-f").focus(); return; }
      if(isNew && r.dataset.p==="Instagram" && n==null){ toast("Add their Instagram followers, the full number, e.g. 45200."); r.querySelector(".pe-f").focus(); return; }
      const hh = (r.querySelector(".pe-h")?.value||"").trim().replace(/^@/,""); plats[r.dataset.p] = hh ? {followers:n, handle:hh} : {followers:n}; }
    if(!Object.keys(plats).length){ toast("Tick at least one platform the creator posts on."); return; }
    if(isNew && !$("#e_cat").value){ toast("Pick a category."); document.querySelector(".ob-cats .chip")?.focus(); return; }
    const f = (plats.Instagram || Object.values(plats)[0]).followers;
    const today=iso(TODAY);
    const hist = c.history||[];
    const newHist = f!=null && f!==c.followers ? [...hist.filter(x=>x.d!==today),{d:today,f}].slice(-36) : hist;
    const pk = readPackages(); if(!pk) return; if(isNew) pk.forEach(p=>{ if(!p.quotedOn) p.quotedOn=today; });
    const phn = ($("#e_ph")?.value||"").replace(/[^\d]/g,"").replace(/^0+/,"");
    if(phn && (phn.length<6 || phn.length>14)){ toast("That phone number looks too short or too long. Leave out the country code and the leading 0."); return; }
    const doc = {...c, handle, name:$("#e_name").value.trim(), category:$("#e_cat").value, league:$("#e_lg")?.value||"", phone: phn ? {cc:$("#e_cc").value, num:phn} : null, platforms:plats, platform:Object.keys(plats).join(" + "),
      followers:f, followersUpdated: f!==c.followers && f!=null ? today : (c.followersUpdated||""), history:newHist,
      packages:pk, rateStory:null, rateReel:null, rateNote:"", notes:($("#e_notes")?.value||"").trim(),
      addedFrom: c.addedFrom || "Creator Hub", onboardedOn: c.onboardedOn || today};
    if(isNew){ doc.brands = {}; doc.brandsAt = {}; }
    const FIELDS = {name:"name", category:"category", platforms:"platforms & followers", packages:"prices", phone:"phone", league:"creator type", notes:"notes"};
    const changed = isNew ? [] : Object.entries(FIELDS).filter(([f])=>JSON.stringify(c[f]??null)!==JSON.stringify(doc[f]??null)).map(([,l])=>l);
    const log = isNew ? {act:"onboard", summary:`Onboarded @${handle}${doc.category?` · ${doc.category}`:""}${doc.followers?` · ${fmtN(doc.followers)} followers`:""}`, ref:{creator:handle}}
      : changed.length ? {act:"edit_creator", summary:`@${handle}: changed ${changed.join(", ")}`, ref:{creator:handle}} : null;
    if(await write(()=>cdoc(handle).set(doc), isNew?`@${handle} onboarded`:"Details saved", log)){ S.creators[handle]=doc; if(isNew){ render(); onboardDone(handle); } else openCreator(handle); }
  });
  $("#delBtn")?.addEventListener("click",()=>{
    $("#delZone").innerHTML = `<div class="confirm">Delete @${esc(c.handle)} from the roster? Their deal records stay. This can't be undone.<span class="sp" style="margin-left:auto"></span><button class="btn" type="button" id="delNo">Keep</button><button class="btn danger" type="button" id="delYes">Delete</button></div>`;
    $("#delNo").onclick=()=>$("#delZone").innerHTML="";
    $("#delYes").onclick=async()=>{ if(await write(()=>cdoc(c.handle).delete(), `@${c.handle} deleted`, {act:"delete_creator", summary:`Deleted @${c.handle} from the roster`})) closeDrawer(); };
    $("#delZone").scrollIntoView({block:"nearest"});
  });
}

function collabsHTML(h){
  const camps = Object.entries(S.campaigns).filter(([,k])=>k.handle===h)
    .sort((a,b)=>String(firstDate(a[1])||"9999").localeCompare(String(firstDate(b[1])||"9999")));
  if(!camps.length) return `<div><div class="label">Collaborations</div><p class="hint">No deals yet.</p></div>`;

  return `<div><div class="label">Collaborations · ${camps.length} deal${camps.length>1?"s":""}</div>
    ${[["paid","Paid"],["ugc","UGC"]].map(([lg,l])=>{ const x=leagueScoreOf(h,lg); if(!x) return ""; return `<div class="overall"><span class="ring" style="--p:${x.score};--sc:${scoreColor(x.score)}"><span>${x.score}</span></span><div><b>${l} score ${x.score}</b> <span class="pill ${verdict(x.score)[0]}">${verdict(x.score)[1]}</span><div class="hint">Average of ${x.n} ${l==="UGC"?"free":"paid"} deal${x.n>1?"s":""}: ${x.ids.map(id=>SCORES[id]).join(" + ")}${x.n>1?` ÷ ${x.n}`:""}</div></div></div>`; }).join("") || `<p class="hint">No scored deals yet. A deal is scored once its reel views are logged.</p>`}
    ${ugcStar(h)?`<div class="starnote">★ Strong UGC results and never paid. A good candidate for a first paid deal.</div>`:""}
    <div class="collabs">${camps.slice().reverse().map(([id,k])=>{
      const n = camps.findIndex(x=>x[0]===id)+1; const s = SCORES[id];
      const b = BRANDS.find(x=>x.name===k.brand);
      return `<button type="button" class="crow" data-deal="${esc(id)}">
        <span class="cl"><b>Deal ${n} · <span class="dot" style="background:${b?.c||"var(--line)"}"></span> ${esc(k.brand)}</b><span class="hint">${k.price===0?`<span class="pill ugc">UGC</span> `:""}${esc(dealRange(k))} · ${esc(priceTxt(k.price))}${k.hasCode?" · code":""}</span></span>
        <span class="num cv">${fmtN(k.views)}<small>views</small></span><span class="num cv">${fmtN(k.shares)}<small>shares</small></span><span class="num cv">${fmtN(k.saves)}<small>saves</small></span>
        <span class="cs">${s!=null?`<span class="ring" style="--p:${s};--sc:${scoreColor(s)}"><span>${s}</span></span>`:dueHTML(k)}</span></button>`;}).join("")}</div></div>`;
}

/* Deal stages are automatic: Booked → Live → Collect results → Done. Only "Cancelled" is set by hand. */
const isCancelled = k => k.status==="Cancelled";
function stageOf(k){
  if(isCancelled(k)) return {key:"cancelled", label:"Cancelled"};
  const d = delivs(k), today = iso(TODAY);
  if(!d.length) return {key:"booked", label:"Booked · add dates"};
  if(!d.some(x=>x.date<=today)) return {key:"booked", label:`Booked · first post ${fmtDs(d[0].date)}`};
  const di = dueInfo(k);
  if(di && di.state==="due") return {key:"due", label: di.r==="due" && di.c==="due" ? "Results + code uses due" : di.r==="due" ? "Results due" : "Code uses due"};
  if(di && di.state==="waiting") return {key:"live", label:`Live · collect ${fmtDs(di.r==="waiting"?di.reelsDue:di.codeDue)}`};
  if(di && di.state==="done") return {key:"done", label:"Done"};
  return {key:"live", label:"Live"};
}
const stageHTML = k => { const s=stageOf(k); return `<span class="stage ${s.key}">${esc(s.label)}</span>`; };
const derivedStatus = k => { const s=stageOf(k).key; return s==="cancelled"?"Cancelled": s==="done"?"Completed": s==="booked"?"Scheduled":"Posted"; };

const newUid = () => "p"+Math.random().toString(36).slice(2,9);
function deliverableRow(d, i){
  return `<div class="dl ${d.type==="Story"?"is-story":""}" data-i="${i}" data-uid="${esc(d.uid||newUid())}">
    <select class="in dl-type" aria-label="Post type"><option ${d.type==="Reel"?"selected":""}>Reel</option><option ${d.type==="Story"?"selected":""}>Story</option></select>
    <input class="in dl-date" type="date" min="2024-01-01" max="2030-12-31" value="${esc(d.date||"")}" aria-label="Posting date">
    <input class="in dl-url" type="url" inputmode="url" placeholder="Reel link, once it's live" value="${esc(d.url||"")}" aria-label="Link to the reel"><span class="dl-nolink">No link for stories</span>
    ${d.url&&d.type!=="Story"?`<a class="plink dl-open" href="${esc(d.url)}" target="_blank" rel="noopener" title="Open the post">↗</a>`:`<span class="dl-open"></span>`}
    <button class="btn ghost dl-x" type="button" aria-label="Remove this post">✕</button></div>`;
}
function platformOptions(h, cur){
  const ps = h && S.creators[h] ? Object.keys(platformsOf(S.creators[h])) : [];
  const list = ps.length ? ps : ["Instagram"];
  if(cur && !list.includes(cur)) list.push(cur);
  return list.map(p=>`<option ${p===(cur||list[0])?"selected":""}>${esc(p)}</option>`).join("");
}
function openCampaign(id, handle, unlockTerms, preBrand){
  const isNew = !id;
  if(isNew && handle && S.creators[handle]?.dnb){ toast(`@${handle} is flagged Do not book: ${S.creators[handle].dnbReason||""}`); return; }
  const k = isNew ? {handle:handle||"", name:"", brand:preBrand || (S.f?.brand ? BRANDS.find(b=>b.key===S.f.brand)?.name : null) || BRANDS[0].name, platform:"", price:null, currency:"USD", deliverables:[], views:null, shares:null, saves:null, status:"", notes:"", hasCode:false, promoCode:"", orders:null, revenue:null, onTime:null, followersAtPost:null, resultsMeasuredOn:"", codeMeasuredOn:""}
    : JSON.parse(JSON.stringify(S.campaigns[id]));
  if(!Array.isArray(k.deliverables)) k.deliverables = delivs(k);
  k.deliverables = delivs(k).map(d=>({...d, uid:d.uid||newUid()}));
  const units = reelUnits(k), combined = units[0]?.combined;
  const lockCreator = !isNew || (handle && S.creators[handle]);
  const termsLocked = !isNew && !unlockTerms;
  const today = iso(TODAY);
  const live = delivs(k).some(x=>x.date<=today);
  const di = isNew ? null : dueInfo(k);
  const opt=(v,cur)=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`;
  const dayN = meas => { const lr=lastReel(k); return meas&&lr ? daysBetween(lr, meas) : null; };
  const measHint = (meas, need) => { const n=dayN(meas); return n==null ? "" : `Day ${n} after the last reel${n<need?` · early, re-collect on day ${need}`:""}`; };
  const cr = S.creators[k.handle];
  drawer(`
    <div class="dhead"><div style="min-width:0"><h2>${isNew?"Book a deal":`${igLink(k.handle,"big")} · ${esc(k.brand)}`}</h2><div class="sub">${isNew?"Lock the agreed terms. Your team then only adds posting dates and results.":`${stageHTML(k)} <span class="hint">${esc(dealRange(k))}</span>`}</div></div>
      <button class="btn ghost x" type="button" data-close aria-label="Close">✕</button></div>
    <div class="dbody">
      ${!isNew && k.typesToCheck ? `<div class="warnbox">Imported from the sheet, which didn't say which dates were reels and which were stories. I guessed the first date was the reel. Please confirm the post types below and save.</div>`:""}

      <section class="dsec">
        <div class="dsec-h"><span class="stepn">1</span><b>Deal terms</b>${termsLocked?`<span class="lock">🔒 Locked</span><button class="btn ghost" type="button" id="editTerms" style="margin-left:auto;padding:4px 12px">Edit terms</button>`:""}</div>
        ${termsLocked ? `<div class="dview">
            <div><span>Creator</span><b>${igLink(k.handle)}</b></div><div><span>Brand</span><b>${esc(k.brand)}</b></div>
            <div><span>Platform</span><b>${esc(k.platform||"Instagram")}</b></div><div><span>Price</span><b>${esc(priceTxt(k.price))}</b></div>
            <div><span>Package</span><b>${esc(k.package||pkgName({reels:reelDates(k).length,stories:delivs(k).length-reelDates(k).length})||"—")}</b></div>
            <div><span>Promo code</span><b>${k.hasCode?esc(k.promoCode||"Yes"):"No code"}</b></div>
            ${k.notes?`<div class="full"><span>Notes</span><b style="font-weight:400">${esc(k.notes)}</b></div>`:""}
          </div>
          <input type="hidden" id="k_h" value="${esc(k.handle)}">`
        : `<datalist id="handles">${Object.keys(S.creators).sort().map(h=>`<option value="${esc(h)}">`).join("")}</datalist>
          <div class="grid2">
            ${lockCreator ? `<div class="field"><span>Creator</span><div class="locked">${igLink(k.handle)} <span class="lock">🔒</span><div class="hint">${esc(cr?.name||"")}</div></div><input type="hidden" id="k_h" value="${esc(k.handle)}"></div>`
              : `<label class="field"><span>Creator (from the roster)</span><input id="k_h" type="text" list="handles" value="" placeholder="Start typing @handle" autocomplete="off"><span class="hint">Not in the roster? <button class="linkbtn" type="button" id="onboardNew">Onboard them first</button></span></label>`}
            <label class="field"><span>Brand</span><select id="k_b">${BRANDS.map(b=>opt(b.name,k.brand)).join("")}</select></label>
            <label class="field"><span>Platform</span><select id="k_pl">${platformOptions(lockCreator?k.handle:"", k.platform)}</select></label>
            <div class="field" id="pkgPick">${pkgPickHTML(lockCreator?k.handle:"")}</div>
            <label class="field"><span>Agreed price (USD, 0 if free)</span><input id="k_price" type="number" min="0" step="0.01" value="${esc(k.price??"")}"><span class="hint" id="budgetHint"></span></label>
          </div>
          <label class="check rc-save" id="rcBox" hidden><input type="checkbox" id="k_rc" checked> <span id="rcText">Save this package to their prices</span></label>
          <label class="check" style="margin-top:12px"><input type="checkbox" id="k_hc" ${k.hasCode?"checked":""}> This deal has a promo code</label>
          <div id="codeBox" ${k.hasCode?"":"hidden"} style="margin-top:8px;max-width:260px"><label class="field"><span>Promo code (must be unique)</span><input id="k_pc" type="text" value="${esc(k.promoCode)}" placeholder="e.g. RETTAJ15" autocapitalize="characters"></label></div>
          <label class="field" style="margin-top:12px"><span>Notes</span><input id="k_n" type="text" value="${esc(k.notes)}" placeholder="e.g. no spicy items, deliver to their office"></label>`}
      </section>

      <section class="dsec">
        <div class="dsec-h"><span class="stepn">2</span><b>Posts</b><span class="hint" style="margin-left:6px">planned dates are fine, update them if they move</span></div>
        <div id="dlList" class="dllist">${k.deliverables.map(deliverableRow).join("")}</div>
        <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" type="button" id="addReel">+ Reel</button><button class="btn" type="button" id="addStory">+ Story</button></div>
        <p class="hint" style="margin:6px 0 0">One line per post. Results are collected ${REELS_DAYS} days after the last reel${k.hasCode?`, code uses after ${CODE_DAYS} days`:""}.</p>
      </section>

function dealLog(isNew, k, doc, cid){
  const who = `@${doc.handle} · ${doc.brand}`;
  if(isNew) return {act:"book", summary:`Booked ${who} · ${priceTxt(doc.price)} · ${doc.package||"no posts"} · first post ${fmtDs(delivs(doc)[0]?.date)}`, ref:{deal:cid}};
  const T = [["price","price",v=>priceTxt(v)],["brand","brand",v=>v],["platform","platform",v=>v||"Instagram"],["promoCode","promo code",v=>v||"none"]];
  const tc = T.filter(([f])=>(k[f]??null)!==(doc[f]??null)).map(([f,l,fm])=>`${l} ${fm(k[f])} → ${fm(doc[f])}`);
  if(tc.length) return {act:"terms", summary:`${who}: ${tc.join(", ")}`, ref:{deal:cid}};
  const R = ["views","shares","saves","orders","onTime","storyViews"];
  if(R.some(f=>(k[f]??null)!==(doc[f]??null))) return {act:"results", summary:`${who}: ${fmtN(doc.views)} views · ${fmtN(doc.shares)} shares · ${fmtN(doc.saves)} saves${doc.hasCode&&doc.orders!=null?` · ${doc.orders} code uses`:""}${doc.onTime===false?" · posted late":""}`, ref:{deal:cid}};
  const a = delivs(k).map(d=>d.type+d.date).join(), b = delivs(doc).map(d=>d.type+d.date).join();
  if(a!==b) return {act:"dates", summary:`${who}: posts now ${dealRange(doc)}`, ref:{deal:cid}};
  return null;
}

/* ---------- Team logins & activity log ----------
   Each person signs in with Firebase Authentication as <username>@creators.percent-labs.com. Roles are enforced by firestore.rules.
   Activity is written to the "logs" collection, which only the admin can read (see firestore.rules). */
const USERS = {
  admin: {name:"Admin", role:"admin"},
  marlo: {name:"Marla", role:"editor"},
  layan: {name:"Layan", role:"editor"},
};
const ROLE_LABEL = {admin:"Admin", editor:"Marketing editor"};
const USER_COLORS = {admin:"var(--fg)", marlo:"var(--rocky)", layan:"var(--bunzo)"};
S.me = null;
const isAdmin = () => S.me?.role==="admin";

async function logAct(act, summary, ref, extra){
  try{
    if(!db || !S.me) return;
    await db.collection("logs").add({at:new Date().toISOString(), username:S.me.username, user:S.me.name, role:S.me.role, act, summary, ref:ref||null, ...(extra||{})});
  }catch(e){ /* logging never blocks work */ }
}
function applyRole(){
